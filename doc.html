<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>مستند | قريب مني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
  /* Customer view of one invoice or receipt, opened from a private link sent on WhatsApp. Printable on A4. */
  :root{
    --ivory:#FAF7F2; --sand:#F1EADF; --card:#FFFFFF; --navy:#1F3A4D; --muted:#5A6A76;
    --brass:#B8915A; --brass-text:#85632F; --border:#E3D9CA; --ok:#2F6B4F; --error:#B3261E;
    --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif; --body:"IBM Plex Sans Arabic",Tahoma,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ivory);color:var(--navy);font-family:var(--body);font-size:15px;line-height:1.7;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
  .bar{max-width:820px;margin:0 auto 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .btn{border:1.5px solid var(--border);background:var(--card);color:var(--navy);border-radius:10px;padding:8px 16px;font:600 14px var(--display);cursor:pointer}
  .btn.solid{background:var(--navy);color:var(--ivory);border-color:var(--navy)}
  .paper{max-width:820px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:30px}
  .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--brass);padding-bottom:14px;flex-wrap:wrap}
  .co{display:flex;gap:12px;align-items:center}
  .co svg{width:84px;height:auto}
  .co svg path,.co svg circle{fill:none;stroke:var(--navy);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .co svg .h{stroke:var(--brass)}
  .co b{font-family:var(--display);font-size:20px;display:block}
  .small{font-size:12px;color:var(--muted)}
  .ttl{text-align:end}
  .ttl h1{font-family:var(--display);font-size:22px;color:var(--brass-text);margin:0}
  .ltr{direction:ltr;unicode-bidi:isolate}
  .amt{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--navy);color:var(--ivory);border-radius:10px;padding:14px 18px;margin:18px 0;flex-wrap:wrap}
  .amt b{font-family:var(--display);font-size:26px}
  .box{background:var(--ivory);border-radius:8px;padding:12px 14px;margin-top:16px}
  dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:6px 0 0}
  dt{color:var(--muted)} dd{margin:0;min-width:0;overflow-wrap:anywhere}
  .tw{overflow-x:auto;margin-top:14px}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{background:var(--navy);color:var(--ivory);font-weight:600;font-size:12.5px;padding:7px 8px;text-align:start}
  td{border-bottom:1px solid var(--border);padding:7px 8px}
  .n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tot{margin-top:12px;margin-inline-start:auto;width:min(340px,100%);display:grid;grid-template-columns:1fr auto;gap:4px 16px}
  .tot .g{font-family:var(--display);font-weight:700;font-size:16px;border-top:2px solid var(--navy);padding-top:6px}
  .void{color:var(--error);font-family:var(--display);font-weight:700;text-align:center;border:2px solid var(--error);border-radius:8px;padding:6px;margin-bottom:12px}
  .paid{color:var(--ok);font-weight:700}
  .foot{margin-top:22px;border-top:1px solid var(--border);padding-top:10px;text-align:center}
  .msg{max-width:820px;margin:60px auto;text-align:center;color:var(--muted)}
  @media (max-width:560px){ .paper{padding:18px} .ttl{text-align:start} }
  @media print{ body{background:#fff;padding:0} .bar{display:none} .paper{border:0;padding:0;max-width:none} th,.amt{-webkit-print-color-adjust:exact;print-color-adjust:exact} @page{size:A4;margin:14mm} }
</style>
</head>
<body>
<div class="bar">
  <button class="btn" type="button" id="lang">EN</button>
  <button class="btn solid" type="button" id="printBtn"></button>
</div>
<div id="out"><p class="msg" id="loading"></p></div>

<script>
  const SUPABASE_URL = 'https://qtcgeuqqixmmpioucolx.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_8rol_CEvn7ECzAX5gcGwYw_Cdt8uJJy';   // المفتاح العام فقط
  const COMPANY = { address_ar: 'العامرات، مسقط، سلطنة عُمان', address_en: 'Al Amerat, Muscat, Sultanate of Oman', cr: '[رقم السجل التجاري]', phone: '[رقم الهاتف]' };

  const T = {
    ar: { title: 'مستند | قريب مني', print: 'طباعة / حفظ PDF', loading: 'جارٍ تحميل المستند...', notFound: 'لم نجد هذا المستند. تأكد من الرابط أو تواصل معنا.', fail: 'تعذّر تحميل المستند. تحقق من الإنترنت وحاول مرة أخرى.',
          invoice: 'فاتورة', receipt: 'إيصال استلام', voidInv: 'هذه الفاتورة ملغاة', voidRec: 'هذا الإيصال ملغى', amount: 'المبلغ المستلم', from: 'استلمنا من', forInv: 'عن الفاتورة', method: 'طريقة الدفع', ref: 'رقم العملية',
          customer: 'العميل', req: 'رقم الطلب', svcDate: 'تاريخ الخدمة', wil: 'الولاية', desc: 'الوصف', qty: 'الكمية', price: 'سعر الوحدة', line: 'المبلغ', sub: 'المجموع', disc: 'الخصم', total: 'الإجمالي', paid: 'المدفوع', due: 'المتبقي',
          invTotal: 'إجمالي الفاتورة', paidToDate: 'المدفوع حتى الآن', fully: 'مسددة بالكامل', receipts: 'الدفعات المستلمة', rNo: 'رقم الإيصال', rDate: 'التاريخ',
          electronic: 'مستند إلكتروني صادر من نظام قريب مني ولا يحتاج إلى توقيع.', vat: 'المنشأة غير مسجّلة في ضريبة القيمة المضافة، وهذا المستند ليس فاتورة ضريبية.', thanks: 'شكراً لاختياركم قريب مني', omr: 'ر.ع', locale: 'ar-OM',
          pm: { cash: 'نقداً', transfer: 'تحويل بنكي', card: 'بطاقة', other: 'أخرى' }, langBtn: 'EN' },
    en: { title: 'Document | Qareeb Minni', print: 'Print / Save PDF', loading: 'Loading document...', notFound: 'We could not find this document. Check the link or contact us.', fail: 'Could not load the document. Check your internet and try again.',
          invoice: 'Invoice', receipt: 'Payment receipt', voidInv: 'This invoice is void', voidRec: 'This receipt is void', amount: 'Amount received', from: 'Received from', forInv: 'For invoice', method: 'Payment method', ref: 'Reference',
          customer: 'Customer', req: 'Request no.', svcDate: 'Service date', wil: 'Wilayat', desc: 'Description', qty: 'Qty', price: 'Unit price', line: 'Amount', sub: 'Subtotal', disc: 'Discount', total: 'Total', paid: 'Paid', due: 'Balance due',
          invTotal: 'Invoice total', paidToDate: 'Paid to date', fully: 'Paid in full', receipts: 'Payments received', rNo: 'Receipt', rDate: 'Date',
          electronic: 'Electronic document issued by the Qareeb Minni system, valid without signature.', vat: 'The business is not VAT-registered; this is not a tax invoice.', thanks: 'Thank you for choosing Qareeb Minni', omr: 'OMR', locale: 'en-GB',
          pm: { cash: 'Cash', transfer: 'Bank transfer', card: 'Card', other: 'Other' }, langBtn: 'عربي' }
  };
  const WIL_EN = { 'مسقط': 'Muscat', 'مطرح': 'Muttrah', 'بوشر': 'Bausher', 'السيب': 'Seeb', 'العامرات': 'Al Amerat', 'قريات': 'Qurayyat', 'ولاية أخرى': 'Another wilayat' };
  const LOGO = '<svg viewBox="30 4 262 124" aria-hidden="true"><path d="M58 118C53 110 36 98 36 78A22 22 0 1 1 80 78C80 98 63 110 58 118Z"/><circle cx="58" cy="78" r="8"/><path d="M58 118c-4 3-1 7 4 5C100 112 150 128 168 108C182 92 140 86 150 70C160 54 210 70 236 76C248 79 256 80 262 78c4-2 2-6-2-4"/><path d="M262 74C257 66 240 54 240 34A22 22 0 1 1 284 34C284 54 267 66 262 74Z"/><path class="h" d="M253 37L262 29L271 37V45H253Z"/></svg>';
  let lang = 'ar';
  try { const s = localStorage.getItem('qm-lang'); if (s === 'en' || s === 'ar') lang = s; } catch (e) {}
  let doc = null, state = 'loading';
  const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const money = n => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 });
  const L = () => T[lang];
  const dt = (iso, time) => iso ? new Date(iso).toLocaleString(L().locale, Object.assign({ timeZone: 'Asia/Muscat', dateStyle: 'medium' }, time ? { timeStyle: 'short' } : {})) : '';
  const day = d => d ? new Date(d + 'T00:00:00').toLocaleDateString(L().locale, { dateStyle: 'medium' }) : '';

  function header(title, no, date){
    const l = L();
    return `<div class="ph"><div class="co">${LOGO}<div><b>قريب مني · Qareeb Minni</b><div class="small">${esc(lang === 'en' ? COMPANY.address_en : COMPANY.address_ar)}</div><div class="small">${lang === 'en' ? 'CR' : 'س.ت'}: ${esc(COMPANY.cr)} · <span class="ltr">${esc(COMPANY.phone)}</span></div></div></div>
      <div class="ttl"><h1>${esc(title)}</h1><div class="ltr" style="font-weight:700">${esc(no)}</div><div class="small">${esc(date)}</div></div></div>`;
  }
  function pairs(list){ return '<dl>' + list.filter(p => p[1]).map(([k, v, ltr]) => `<dt>${esc(k)}</dt><dd${ltr ? ' class="ltr"' : ''}>${esc(v)}</dd>`).join('') + '</dl>'; }
  function foot(){ const l = L(); return `<div class="foot"><div class="small">${esc(l.electronic)}</div><div class="small">${esc(l.vat)}</div><div class="small">${esc(l.thanks)}</div></div>`; }

  function render(){
    const l = L();
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
    document.title = l.title; document.getElementById('lang').textContent = l.langBtn; document.getElementById('printBtn').textContent = l.print;
    const out = document.getElementById('out');
    document.getElementById('printBtn').hidden = !doc;
    if (!doc) { out.innerHTML = `<p class="msg">${esc(state === 'loading' ? l.loading : state === 'missing' ? l.notFound : l.fail)}</p>`; return; }
    const due = Math.max(0, Number(doc.type === 'receipt' ? doc.invoice.total - doc.invoice.paid : doc.total - doc.paid));
    let h = '';
    if (doc.type === 'receipt') {
      if (doc.status === 'void') h += `<div class="void">${esc(l.voidRec)}</div>`;
      h += header(l.receipt, doc.number, dt(doc.issued_at, true));
      h += `<div class="amt"><span>${esc(l.amount)}</span><b class="ltr">${money(doc.amount)} ${l.omr}</b></div>`;
      h += `<div class="box">${pairs([[l.from, doc.customer_name], [l.forInv, doc.invoice.number, true], [l.method, l.pm[doc.method] || doc.method], [l.ref, doc.reference, true]])}</div>`;
      h += `<div class="tot"><span>${esc(l.invTotal)}</span><span class="n">${money(doc.invoice.total)}</span><span>${esc(l.paidToDate)}</span><span class="n">${money(doc.invoice.paid)}</span>
            <span class="g">${esc(l.due)}</span><span class="n g">${due > 0 ? money(due) : `<span class="paid">${esc(l.fully)}</span>`}</span></div>`;
    } else {
      if (doc.status === 'void') h += `<div class="void">${esc(l.voidInv)}</div>`;
      h += header(l.invoice, doc.number, dt(doc.issued_at));
      h += `<div class="box">${pairs([[l.customer, doc.customer_name], [l.req, doc.request_code, true], [l.svcDate, day(doc.service_date)], [l.wil, lang === 'en' ? (WIL_EN[doc.wilayat] || doc.wilayat) : doc.wilayat]])}</div>`;
      const sub = (doc.items || []).reduce((s, i) => s + Math.round(i.qty * i.price * 1000) / 1000, 0);
      h += `<div class="tw"><table><thead><tr><th>#</th><th>${esc(l.desc)}</th><th class="n">${esc(l.qty)}</th><th class="n">${esc(l.price)}</th><th class="n">${esc(l.line)} (${l.omr})</th></tr></thead><tbody>` +
           (doc.items || []).map((i, n) => `<tr><td>${n + 1}</td><td dir="auto">${esc(i.desc)}</td><td class="n">${esc(i.qty)}</td><td class="n">${money(i.price)}</td><td class="n">${money(i.qty * i.price)}</td></tr>`).join('') + '</tbody></table></div>';
      h += `<div class="tot"><span>${esc(l.sub)}</span><span class="n">${money(sub)}</span>` + (Number(doc.discount) > 0 ? `<span>${esc(l.disc)}</span><span class="n">−${money(doc.discount)}</span>` : '') +
           `<span class="g">${esc(l.total)} (${l.omr})</span><span class="n g">${money(doc.total)}</span><span>${esc(l.paid)}</span><span class="n">${money(doc.paid)}</span><span>${esc(l.due)}</span><span class="n">${due > 0 ? money(due) : `<span class="paid">${esc(l.fully)}</span>`}</span></div>`;
      if ((doc.receipts || []).length) {
        h += `<h3 class="small" style="margin-top:18px;font-weight:700">${esc(l.receipts)}</h3><div class="tw"><table><thead><tr><th>${esc(l.rNo)}</th><th>${esc(l.rDate)}</th><th>${esc(l.method)}</th><th class="n">${esc(l.line)}</th></tr></thead><tbody>` +
             doc.receipts.map(r => `<tr><td class="ltr">${esc(r.number)}</td><td>${esc(dt(r.issued_at))}</td><td>${esc(l.pm[r.method] || r.method)}</td><td class="n">${money(r.amount)}</td></tr>`).join('') + '</tbody></table></div>';
      }
      if (doc.notes) h += `<p class="small" dir="auto">${esc(doc.notes)}</p>`;
    }
    out.innerHTML = `<div class="paper">${h}${foot()}</div>`;
  }

  document.getElementById('lang').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('qm-lang', lang); } catch (e) {} render(); };
  document.getElementById('printBtn').onclick = () => window.print();

  (async () => {
    render();
    const token = new URLSearchParams(location.search).get('t') || '';
    if (!/^[0-9a-f-]{36}$/i.test(token)) { state = 'missing'; render(); return; }
    try {
      const headers = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' };
      if (SUPABASE_KEY.startsWith('eyJ')) headers.Authorization = 'Bearer ' + SUPABASE_KEY;
      const res = await fetch(SUPABASE_URL + '/rest/v1/rpc/get_public_doc', { method: 'POST', headers, body: JSON.stringify({ p_token: token }) });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      doc = await res.json();
      state = doc ? 'ok' : 'missing';
    } catch (e) { state = 'error'; }
    render();
  })();
</script>
</body>
</html>
