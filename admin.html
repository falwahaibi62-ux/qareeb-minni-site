<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Cpath d='M100 64V36A22 22 0 0 0 78 14H36A22 22 0 0 0 14 36V78A22 22 0 0 0 36 100H64' fill='none' stroke='%237C4DDB' stroke-width='15' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M70 70L86 86' stroke='%237C4DDB' stroke-width='15' stroke-linecap='round'/%3E%3Crect x='84' y='84' width='30' height='30' rx='8' fill='%23F27FC4'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة الطلبات | قريب مني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
  /* Layout: a quiet operations board — tabs for requests, storage units, reports and prices; counters on top. */
  :root{
    /* هوية قريب مني: بنفسجي داكن + تدرّج باستيل */
    --ivory:#F7F5FD; --sand:#EFEAFB; --card:#FFFFFF;
    --navy:#1C1633; --navy-2:#2E2552; --muted:#6B6585;
    --brass:#7C4DDB; --brass-text:#6A3FC9; --border:#E4DEF3;
    --grad:linear-gradient(100deg,#8FB8FF,#B8B2FF 28%,#D9A8F5 50%,#F08BD8 72%,#FFB59A);
    --error:#C0264B; --ok:#1F7F6C; --warn:#9A5B00;
    --display:"Tajawal",Tahoma,sans-serif;
    --body:"Tajawal",Tahoma,sans-serif;
    --s-new:#F0609E; --s-contacted:#6A8CFF; --s-confirmed:#7C4DDB; --s-assigned:#1F7F6C; --s-done:#6B6585; --s-cancelled:#C0264B;
    --u-available:#1F7F6C; --u-reserved:#E08A1E; --u-rented:#7C4DDB; --u-maintenance:#8E8AA3;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ivory);color:var(--navy);font-family:var(--body);font-size:15px;line-height:1.6}
  .wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.3}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .btn{border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--navy);color:var(--ivory)}
  .btn:hover{background:var(--navy-2)}
  .btn:disabled{opacity:.6;cursor:default}
  .btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--border)}
  .btn-ghost:hover{background:var(--sand)}
  .lang{background:transparent;border:1.5px solid var(--border);color:var(--navy);border-radius:999px;padding:6px 14px;font:600 14px var(--display);cursor:pointer}
  .lang:hover{border-color:var(--navy)}
  input,select,textarea{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;min-width:0}
  input:focus,select:focus,textarea:focus{border-color:var(--navy);outline:none}
  [hidden]{display:none!important}

  /* Login */
  .login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;display:grid;gap:14px}
  .login-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .login-card h1{font-size:24px}
  .login-card p{margin:0;color:var(--muted)}
  .login-card label{display:grid;gap:6px;font-weight:600}
  .msg{font-size:14px;color:var(--error);min-height:1em}
  .msg.ok{color:var(--ok)}
  .login-card[hidden]{display:none}
  .link-btn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;justify-self:start;font:inherit;font-size:14px}

  /* Header + tabs */
  header{position:sticky;top:0;z-index:10;background:rgba(247,245,253,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{width:40px;height:40px}
  .brand b{font-family:var(--display);font-size:18px}
  .brand span{display:block;font-size:12px;color:var(--muted)}
  .who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
  .pol{font-size:13px;font-weight:600;color:var(--brass-text);text-decoration:none;border-bottom:1px dashed var(--brass)}
  .pol:hover{color:var(--navy);border-bottom-color:var(--navy)}
  .tabs{display:flex;gap:4px}
  .tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
  .tab[aria-selected=true]{color:var(--navy);border-bottom-color:var(--brass)}

  /* Toolbar */
  .counters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 12px}
  .chip{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
  .chip .n{font-variant-numeric:tabular-nums;background:var(--sand);border-radius:999px;padding:0 8px;font-size:13px}
  .chip[aria-pressed=true]{border-color:var(--navy);background:var(--navy);color:var(--ivory)}
  .chip[aria-pressed=true] .n{background:rgba(255,255,255,.18)}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .tools{display:flex;gap:10px;align-items:center;margin:20px 0 16px;flex-wrap:wrap}
  .counters + .tools{margin-top:0}
  .tools input{max-width:320px}
  .stamp{font-size:13px;color:var(--muted)}

  /* Cards */
  .list{display:grid;gap:14px;padding-bottom:48px}
  .view-toggle{display:inline-flex;border:1.5px solid var(--border);border-radius:10px;overflow:hidden}
  .view-toggle button{border:0;background:transparent;padding:8px 14px;font:600 14px var(--body);cursor:pointer;color:var(--muted)}
  .view-toggle button[aria-pressed=true]{background:var(--navy);color:var(--ivory)}
  .tbl-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:auto;max-height:calc(100vh - 230px)}
  table.reqs{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
  table.reqs th{position:sticky;top:0;z-index:1;background:var(--navy);color:var(--ivory);font-weight:600;font-size:13px;text-align:start;padding:10px 12px;white-space:nowrap;cursor:pointer;user-select:none}
  table.reqs th[aria-sort]::after{content:" ▾";opacity:.8}
  table.reqs th[aria-sort=ascending]::after{content:" ▴"}
  table.reqs td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;vertical-align:middle}
  table.reqs tbody tr{cursor:pointer}
  table.reqs tbody tr:nth-child(even) td{background:#FAF8FE}
  table.reqs tbody tr:hover td{background:var(--sand)}
  table.reqs tbody tr:focus-visible{outline:3px solid var(--brass);outline-offset:-3px}
  table.reqs .nm{font-weight:600;max-width:200px;overflow:hidden;text-overflow:ellipsis}
  table.reqs .mut{color:var(--muted);font-size:13px}
  table.reqs .badge{display:inline-block}
  .tbl-count{font-size:13px;color:var(--muted);padding:8px 2px}
  .req{background:var(--card);border:1px solid var(--border);border-inline-start:4px solid var(--border);border-radius:14px;padding:18px;display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
  .req-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .req-head h3{font-size:18px}
  .badge{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;color:#fff}
  .code{font-family:var(--display);font-size:13px;color:var(--muted);direction:ltr}
  .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:10px;font-size:14px}
  .meta dt{color:var(--muted)}
  .meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
  .meta dd.ltr{direction:ltr;unicode-bidi:isolate}
  html[dir=ltr] .meta dd{text-align:left}
  html[dir=rtl] .meta dd{text-align:right}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .links a{font-size:13px;font-weight:600;text-decoration:none;border:1.5px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--navy);background:#fff}
  .links a:hover{border-color:var(--navy)}
  .edit{display:grid;gap:10px;align-content:start;background:var(--ivory);border-radius:10px;padding:14px}
  .edit label{display:grid;gap:4px;font-size:13px;font-weight:600}
  .edit textarea{min-height:64px;resize:vertical}
  .hint{font-size:12px;font-weight:500;color:var(--muted)}
  .hint.warn{color:var(--warn)}
  .save-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .saved{font-size:13px;color:var(--ok)}
  .saved.err{color:var(--error)}
  .audit{font-size:12px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:48px 16px;background:var(--card);border:1px dashed var(--border);border-radius:14px}
  .flag{font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}
  .flag.bad{background:#F8E1DF;color:var(--error)}
  .flag.soon{background:#F6E9D2;color:var(--warn)}
  .stars{color:var(--brass);letter-spacing:1px}

  /* Driver form */
  .dform{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .dform h3{grid-column:1/-1;font-size:18px}
  .dform h4{grid-column:1/-1;font-size:14px;color:var(--brass-text);border-bottom:1px solid var(--border);padding-bottom:4px;margin-top:6px}
  .dform label{display:grid;gap:4px;font-size:13px;font-weight:600}
  .dform .wide{grid-column:1/-1}
  .dform .check{display:flex;gap:8px;align-items:flex-start;font-weight:500}
  .dform .check input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--navy)}
  .dform .legal{font-size:12px;color:var(--muted);background:var(--sand);border-radius:8px;padding:8px 10px}
  .rate{display:grid;grid-template-columns:1fr auto;gap:6px}
  .phone{display:flex;direction:ltr}
  .phone span{display:flex;align-items:center;padding:0 10px;background:var(--sand);border:1.5px solid var(--border);border-right:0;border-radius:8px 0 0 8px;font-weight:600;color:var(--muted)}
  .phone input{border-radius:0 8px 8px 0;direction:ltr;text-align:left}

  /* Invoice: modal with an issue form or the printable invoice */
  .inv-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
  .inv-tag{font-weight:700;border-radius:6px;padding:1px 8px;background:var(--sand);color:var(--navy)}
  .inv-tag.paid{background:#DDEEE5;color:var(--ok)}
  .inv-tag.due{background:#F6E9D2;color:var(--warn)}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(28,22,51,.45);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px}
  .sheet{background:var(--card);border-radius:16px;width:100%;max-width:820px;padding:20px;display:grid;gap:14px}
  .sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .sheet-top h3{font-size:19px}
  .sheet-actions{display:flex;gap:8px;flex-wrap:wrap}
  .items{width:100%;border-collapse:collapse;font-size:14px}
  .items th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:4px}
  .items td{padding:4px;vertical-align:top}
  .items td.num{width:110px}
  .items td.qty{width:80px}
  .items .x{background:none;border:0;color:var(--error);font-size:18px;cursor:pointer;padding:4px 8px}
  .inv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .inv-grid label{display:grid;gap:4px;font-size:13px;font-weight:600}
  .inv-grid .wide{grid-column:1/-1}
  .sum{font-family:var(--display);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}

  /* The invoice paper — bilingual, printed as-is */
  .paper{background:#fff;color:#1C1633;border:1px solid var(--border);border-radius:10px;padding:28px;font-size:13.5px}
  .paper .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--brass);padding-bottom:14px}
  .paper .co{display:flex;gap:12px;align-items:center}
  .paper .co svg{width:54px;height:54px}
  .paper .co b{font-family:var(--display);font-size:20px;display:block}
  .paper .small{font-size:12px;color:#6B6585}
  .paper .ttl{text-align:end}
  .paper .ttl h2{font-size:22px;color:#6A3FC9}
  .paper .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
  .paper .box{background:#F7F5FD;border-radius:8px;padding:10px 12px}
  .paper .box dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0}
  .paper .box dt{color:#6B6585}
  .paper .box dd{margin:0}
  .paper table{width:100%;border-collapse:collapse;margin-top:6px}
  .paper th{background:#1C1633;color:#F7F5FD;font-weight:600;font-size:12px;padding:7px 8px;text-align:start}
  .paper td{border-bottom:1px solid #E4DEF3;padding:7px 8px}
  .paper .n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
  .paper .tot{margin-top:12px;margin-inline-start:auto;width:min(320px,100%);display:grid;grid-template-columns:1fr auto;gap:4px 16px}
  .paper .tot .g{font-family:var(--display);font-weight:700;font-size:16px;border-top:2px solid #1C1633;padding-top:6px}
  .paper .foot{margin-top:20px;border-top:1px solid #E4DEF3;padding-top:10px;text-align:center}
  .paper .amt{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#1C1633;color:#F7F5FD;border-radius:10px;padding:14px 18px;margin:16px 0}
  .paper .amt b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
  .rec-list{width:100%;border-collapse:collapse;font-size:14px}
  .rec-list th{font-size:12px;color:var(--muted);text-align:start;padding:6px;border-bottom:1px solid var(--border)}
  .rec-list td{padding:7px 6px;border-bottom:1px solid var(--border)}
  .rec-list .btn{padding:4px 12px;font-size:13px}
  .sec-h{font-family:var(--display);font-size:16px;margin:4px 0 0}
  .paper .void{color:#B3261E;font-family:var(--display);font-weight:700;font-size:18px;text-align:center;border:2px solid #B3261E;border-radius:8px;padding:4px;margin-bottom:10px}
  .paper .bi{display:block;font-size:11px;color:#6B6585;font-weight:500}
  .ltrnum{direction:ltr;unicode-bidi:isolate}

  /* Reports */
  .rp-controls{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin:20px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end}
  .rp-controls label{display:grid;gap:4px;font-size:13px;font-weight:600}
  .rp-controls h3{grid-column:1/-1;font-size:18px}
  .rp-controls .hint{grid-column:1/-1}
  .rp-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-bottom:48px}
  .rp-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;display:grid;gap:8px;align-content:start}
  .rp-card h4{margin:0;font-family:var(--display);font-size:17px}
  .rp-card p{margin:0;font-size:13.5px;color:var(--muted)}
  .rp-card .btn{justify-self:start;margin-top:6px}
  .paper .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 4px}
  .paper .kpi{background:#F7F5FD;border:1px solid #E4DEF3;border-radius:8px;padding:10px 12px}
  .paper .kpi b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
  .paper .kpi span{font-size:11.5px;color:#6B6585}
  .paper h3.rs{font-size:15px;margin:18px 0 6px;color:#6A3FC9;font-family:var(--display);break-after:avoid}
  .paper .kpis,.paper .two-t > div{break-inside:avoid}
  .paper .two-t{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .paper table.rt{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
  .paper table.rt th{background:#1C1633;color:#F7F5FD;font-weight:600;padding:6px 7px;text-align:start;white-space:nowrap}
  .paper table.rt td{border-bottom:1px solid #E4DEF3;padding:5px 7px;vertical-align:top}
  .paper table.rt tr:nth-child(even) td{background:#FAF8FE}
  .paper table.rt tfoot td{font-weight:700;border-top:2px solid #1C1633;background:#fff}
  .paper .meta-line{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:12px;color:#6B6585;margin-top:10px}
  .paper .meta-line b{color:#1C1633}
  .paper .bad{color:#B3261E;font-weight:600} .paper .soon{color:#8A5A00;font-weight:600}
  .paper .conf{margin-top:18px;border-top:1px solid #E4DEF3;padding-top:8px;font-size:11px;color:#6B6585;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .rt-wrap{overflow-x:auto}
  @media screen and (max-width:860px){ .rp-controls,.rp-cards{grid-template-columns:1fr 1fr} .paper .kpis{grid-template-columns:1fr 1fr} .paper .two-t{grid-template-columns:1fr} }

  @media print{
    body.printing > *:not(#invModal){display:none!important}
    body.printing{background:#fff}
    body.printing #invModal{position:static;background:none;padding:0;display:block}
    body.printing .sheet{max-width:none;padding:0;background:#fff}
    body.printing .sheet > *:not(.paper){display:none!important}
    body.printing .paper{border:0;padding:0}
    @page{size:A4;margin:12mm}
    body.printing .rt-wrap{overflow:visible}
    body.printing .paper table.rt{font-size:10.5px}
    body.printing .paper tr{break-inside:avoid}
    body.printing .paper thead{display:table-header-group}
  }

  @media (max-width:760px){
    .req{grid-template-columns:1fr}
    .dform{grid-template-columns:1fr}
    .who .email{display:none}
    .inv-grid{grid-template-columns:1fr}
    .paper{padding:16px}
    .paper .two{grid-template-columns:1fr}
    .items td.num{width:80px}
    .items td.qty{width:56px}
  }

  /* الأسعار والعروض */
  .pr-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:end;margin:20px 0 14px}
  .pr-head h3{margin:0;font-family:var(--display);font-size:20px}
  .pr-promo{display:flex;gap:10px;flex-wrap:wrap}
  .pr-promo label{display:grid;gap:4px;font-size:13px;font-weight:600;min-width:220px}
  .pr-cat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px 18px 12px;margin-bottom:16px;overflow-x:auto}
  .pr-cat h4{font-family:var(--display);font-size:17px;margin:12px 0 6px}
  .pr-cat table{width:100%;border-collapse:collapse;min-width:640px}
  .pr-cat th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:start;padding:6px 6px}
  .pr-cat td{border-top:1px solid var(--border);padding:8px 6px;vertical-align:middle}
  .pr-cat td.lbl{font-weight:600}
  .pr-cat input.pct{width:80px;text-align:center}
  .pr-cat input.omr{width:110px}
  .pr-prev{font-variant-numeric:tabular-nums;white-space:nowrap}
  .pr-prev > *{display:inline-block;unicode-bidi:isolate;margin-inline-end:8px}
  .pr-prev s{color:var(--muted)}
  .pr-prev b{color:#1F7F6C}
  .pr-prev .off{display:inline-block;background:#E3F7F1;color:#0D5C4E;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700;margin-inline-start:6px}
  .pr-prev .exp{color:var(--error);font-size:12px;font-weight:600}
  .pr-save{padding-bottom:10px}
  .pr-legal{padding-bottom:48px;max-width:760px}
  .pr-cat .rowerr{color:var(--error);font-size:12px;display:block}

  /* لمسات الهوية */
  header::after{content:"";display:block;height:3px;background:var(--grad)}
  .login-card{position:relative;overflow:hidden;box-shadow:0 20px 50px -24px rgba(124,77,219,.35)}
  .login-card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--grad)}
  .login-logo{width:46px;height:46px;flex:none}
  .login-top > div{display:flex;align-items:center;gap:10px}
  .paper .ph{border-bottom:3px solid transparent;border-image:var(--grad) 1}

  /* الوحدات / Units */
  .occ{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 16px;font-weight:600}
  .occ-bar{flex:1;min-width:180px;max-width:420px;height:10px;border-radius:99px;background:var(--sand);overflow:hidden}
  .occ-bar i{display:block;height:100%;background:var(--grad);border-radius:99px}
  .units{display:grid;align-items:start;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-bottom:48px}
  .unit{background:var(--card);border:1px solid var(--border);border-top:4px solid var(--border);border-radius:14px;padding:14px 16px;display:grid;gap:8px;align-content:start}
  .unit-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .unit-head b{font-family:var(--display);font-size:20px;direction:ltr;unicode-bidi:isolate}
  .unit .meta{margin-top:0;font-size:13.5px}
  .unit .btn{justify-self:start;padding:6px 14px;font-size:13px}
  .uform{grid-template-columns:repeat(4,1fr)}
  .bulk{background:var(--sand);border-radius:10px;padding:12px;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end}
  .bulk label{display:grid;gap:4px;font-size:13px;font-weight:600}
  @media (max-width:760px){ .uform,.bulk{grid-template-columns:1fr 1fr} }
</style>

  function docStates(d, onDate){

    const soonStr = soon.toISOString().slice(0, 10);
    return DOCS.map(([key, col]) => {
      const v = d[col];

      return { key, state };
    });
  }

    const bad = docStates(d, onDate).filter(x => x.state === 'missing' || x.state === 'expired');
    if (bad.length) {
      const L = t();
      return { ok: false, why: bad.map(x => x.state === 'missing' ? L.docMissing(L.docs[x.key]) : L.docExpired(L.docs[x.key])).join('، ') };

  // ===== الفواتير / Invoices =====
  // المبالغ: فاصلة الآلاف، والبيسات تظهر فقط إن وُجدت: 5,500 · 12.500 · 0.250
  const money = n => { const v = Math.round(Number(n || 0) * 1000) / 1000; return Number.isInteger(v) ? v.toLocaleString('en-US') : v.toLocaleString('en-US', { minimumFractionDigits: 3, maximumFractionDigits: 3 }); };
  // مبالغ الريال العُماني: حقل نصي فارغ، أرقام وفاصلة عشرية واحدة وحتى 3 خانات (بيسة)، ويُنسَّق تلقائياً عند الخروج: 5500 ← 5,500 و 12.5 ← 12.500
  const toLatin = s => String(s || '').replace(/[\u0660-\u0669]/g, d => d.charCodeAt(0) - 0x0660).replace(/[\u06F0-\u06F9]/g, d => d.charCodeAt(0) - 0x06F0).replace(/[\u066B٫]/g, '.');
  const parseOmr = s => { const v = toLatin(s).replace(/[,،\s]/g, ''); return v === '' ? 0 : Number(v); };
  function omrInput(value){
    const i = el('input'); i.type = 'text'; i.inputMode = 'decimal'; i.dir = 'ltr'; i.placeholder = '0'; i.autocomplete = 'off';
    i.style.textAlign = 'left'; i.style.fontVariantNumeric = 'tabular-nums';
    if (value !== '' && value != null && Number(value) > 0) i.value = money(value);
    i.addEventListener('input', () => {
      let v = toLatin(i.value).replace(/[^\d.]/g, '');
      const k = v.indexOf('.'); if (k >= 0) v = v.slice(0, k + 1) + v.slice(k + 1).replace(/\./g, '').slice(0, 3);
      if (v !== i.value) i.value = v;
    });
    i.addEventListener('blur', () => { if (i.value.trim() !== '' && !Number.isNaN(parseOmr(i.value))) i.value = money(parseOmr(i.value)); });
    return i;
  }
  const dueOf = v => Math.max(0, Number(v.total) - Number(v.amount_paid));

  // نموذج إصدار فاتورة جديدة
  function openInvoiceForm(r){
    const L = t();
    const { top } = sheetTop(`${L.invNew} ${shortCode(r)} · ${r.name}`);
    const tbl = el('table', 'items');
    const hr = el('tr'); [L.itemDesc, L.itemQty, L.itemPrice, ''].forEach(h => hr.append(el('th', null, h)));
    const tb = el('tbody'); tbl.append(el('thead'), tb); tbl.tHead.append(hr);
    const sumEl = el('div', 'sum');
    const addLine = (desc = '', qty = 1, price = '') => {
      const tr = el('tr');
      const d = el('input'); d.maxLength = 120; d.dir = 'auto'; d.value = desc; d.setAttribute('aria-label', L.itemDesc);
      const q = el('input'); q.type = 'number'; q.min = '1'; q.step = '1'; q.value = qty; q.inputMode = 'numeric'; q.setAttribute('aria-label', L.itemQty); q.addEventListener('wheel', e => e.target.blur());
      const p = omrInput(price); p.setAttribute('aria-label', L.itemPrice);
      const x = el('button', 'x', '×'); x.type = 'button'; x.setAttribute('aria-label', L.removeItem); x.onclick = () => { tr.remove(); calc(); };
      const td1 = el('td'), td2 = el('td', 'qty'), td3 = el('td', 'num'), td4 = el('td');
      td1.append(d); td2.append(q); td3.append(p); td4.append(x); tr.append(td1, td2, td3, td4); tb.append(tr);
      [d, q, p].forEach(i => i.addEventListener('input', calc));
    };
    // البند الافتراضي: إيجار الوحدة المخصّصة (شهر واحد بسعرها)، ويمكن تعديل الكمية لعدد الأشهر
    const iu = unitOf(r);
    if (iu) addLine(`${SVC_LINE.storage} — ${iu.code}`, 1, iu.monthly_rent != null ? iu.monthly_rent : '');
    else addLine(SVC_LINE.storage);
    const add = el('button', 'btn btn-ghost', L.addItem); add.type = 'button'; add.onclick = () => { addLine(); calc(); };

    const grid = el('div', 'inv-grid');
    const mk = (label, input) => { const l = el('label', null, label); l.append(input); grid.append(l); return l; };
    const disc = omrInput('');
    const paid = omrInput('');
    const pm = el('select'); fillSelect(pm, L.pm, '');
    mk(L.discount, disc); mk(recOk ? L.paidNow : L.amountPaid, paid); mk(L.payMethod, pm);
    const nt = el('textarea'); nt.maxLength = 400; nt.dir = 'auto'; mk(L.invNotes, nt).classList.add('wide');
    [disc, paid].forEach(i => i.addEventListener('input', calc));

    const readItems = () => [...tb.rows].map(tr => { const [d, q, p] = tr.querySelectorAll('input'); return { desc: d.value.trim(), qty: Number(q.value), price: p.value.trim() === '' ? NaN : parseOmr(p.value) }; });
    function calc(){
      const sub = readItems().reduce((s, i) => s + (i.qty > 0 && i.price >= 0 ? Math.round(i.qty * i.price * 1000) / 1000 : 0), 0);
      const tot = sub - parseOmr(disc.value);
      sumEl.textContent = `${L.subtotal}: ${money(sub)} · ${L.grand}: ${money(tot)} ${L.omr} · ${L.due}: ${money(Math.max(0, tot - parseOmr(paid.value)))} ${L.omr}`;
      return { sub, tot };
    }
    calc();

    const row = el('div', 'save-row');
    const go = el('button', 'btn', L.issueBtn); go.type = 'button';
    const msg = el('span', 'saved'); msg.setAttribute('aria-live', 'polite');
    row.append(go, msg);
    let armed = false;
    go.onclick = async () => {
      const items = readItems();
      const { sub, tot } = calc();
      msg.className = 'saved err';
      if (!items.length || items.some(i => !i.desc || !(i.qty > 0) || !(i.price > 0) || Number.isNaN(i.price))) { msg.textContent = L.errItems; return; }
      if (parseOmr(disc.value) > sub) { msg.textContent = L.errDiscount; return; }
      const paidNow = parseOmr(paid.value);
      if (paidNow > tot + 0.0005) { msg.textContent = L.errPaid; return; }
      if (paidNow > 0 && recOk && !pm.value) { msg.textContent = L.errMethod; return; }
      if (!armed) { armed = true; msg.className = 'saved'; msg.textContent = L.issueAgain; return; }   // تأكيد بضغطة ثانية
      go.disabled = true; msg.className = 'saved'; msg.textContent = L.saving;
      const rec = { request_id: r.id, items, discount: parseOmr(disc.value), payment_method: pm.value || null, notes: nt.value.trim() || null };
      if (!recOk) rec.amount_paid = paidNow;   // قبل تفعيل الإيصالات
      const { data, error } = await db.from('invoices').insert(rec).select().single();
      if (error) { go.disabled = false; armed = false; msg.className = 'saved err'; msg.textContent = L.saveFail + error.message; return; }
      invoices.unshift(data);
      let inv = data, newRec = null;
      if (recOk && paidNow > 0) {
        const rr = await db.from('receipts').insert({ invoice_id: data.id, amount: paidNow, method: pm.value }).select().single();
        if (!rr.error) { newRec = rr.data; receipts.unshift(rr.data); inv = await refreshInvoice(data.id) || data; }
      }
      go.disabled = false; render();
      newRec ? openReceipt(newRec) : openInvoice(inv);
    };

    sheet.replaceChildren(top, tbl, add, grid, sumEl, row);
    modal.hidden = false;
    tb.querySelector('input').focus();
  }

  const ymd = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
  const muscatDay = iso => iso ? new Date(iso).toLocaleDateString('en-CA', { timeZone: 'Asia/Muscat' }) : '';
  function setPreset(p){
    const now = new Date(), y = now.getFullYear(), m = now.getMonth();
    let a, b;
    if (p === 'month') { a = new Date(y, m, 1); b = now; }
    else if (p === 'last') { a = new Date(y, m - 1, 1); b = new Date(y, m, 0); }
    else if (p === 'quarter') { a = new Date(y, m - 2, 1); b = now; }
    else if (p === 'year') { a = new Date(y, 0, 1); b = now; }
    else return;
    $('rpFrom').value = ymd(a); $('rpTo').value = ymd(b);
  }
  $('rpPreset').addEventListener('change', e => setPreset(e.target.value));
  ['rpFrom', 'rpTo'].forEach(id => $(id).addEventListener('change', () => { $('rpPreset').value = 'custom'; }));
  setPreset('month');

  function el2(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pct = (a, b) => b ? Math.round(a * 1000 / b) / 10 + '%' : '—';
  function countBy(list, key, labels){
    const m = {}; list.forEach(x => { const k = x[key] || '—'; m[k] = (m[k] || 0) + 1; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([k, n]) => [labels ? (labels[k] || k) : k, n]);
  }
  function table(head, rows, foot, numCols = []){

    const tr = rows.map(r => '<tr>' + r.map((c, i) => `<td${numCols.includes(i) ? ' class="n"' : ''}>${c && c.html ? c.html : esc(c)}</td>`).join('') + '</tr>').join('');
    const tf = foot ? '<tfoot><tr>' + foot.map((c, i) => `<td${numCols.includes(i) ? ' class="n"' : ''}>${esc(c)}</td>`).join('') + '</tr></tfoot>' : '';
    wrap.innerHTML = `<table class="rt"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody>${tf}</table>`;
    return wrap;
  }
  function kpis(items){ const k = el2('div', 'kpis'); items.forEach(([v, l]) => k.append(el2('div', 'kpi', `<b>${esc(v)}</b><span>${esc(l)}</span>`))); return k; }

  function reportPaper(title, from, to){
    const L = t();
    const paper = el2('div', 'paper'); paper.dir = lang === 'en' ? 'ltr' : 'rtl'; paper.lang = lang;
    const ph = el2('div', 'ph');
    const co = el2('div', 'co'); co.innerHTML = LOGO_SVG;
    const cot = el2('div'); cot.append(el2('b', null, 'قريب مني · Qareeb Minni'), el2('div', 'small', esc(COMPANY.address)), el2('div', 'small', esc((lang === 'en' ? 'CR: ' : 'س.ت: ') + COMPANY.cr)));
    co.append(cot);
    const ttl = el2('div', 'ttl'); ttl.append(el2('h2', null, esc(title)));
    ph.append(co, ttl);
    const stamp = new Date();
    const no = 'RPT-' + ymd(stamp).replace(/-/g, '') + '-' + String(stamp.getHours()).padStart(2, '0') + String(stamp.getMinutes()).padStart(2, '0');
    const line = el2('div', 'meta-line',
      `<span>${esc(L.repPeriodL)}: <b class="ltrnum">${esc(fmtDay(from))} – ${esc(fmtDay(to))}</b></span>` +

  function finishPaper(paper){

  const SVC_ORDER = ['move', 'storage', 'both'];
  function openReport(kind){
    const L = t();
    const from = $('rpFrom').value, to = $('rpTo').value;
    if (!from || !to || from > to) { $('rpHint').textContent = L.repBadRange; $('rpHint').className = 'hint warn'; return; }
    $('rpHint').className = 'hint'; $('rpHint').textContent = L.repHint;
    const inR = iso => { const d = muscatDay(iso); return d >= from && d <= to; };
    const reqs = rows.filter(r => inR(r.created_at)).sort((a, b) => a.created_at < b.created_at ? -1 : 1);
    const invs = invoices.filter(v => inR(v.issued_at)).sort((a, b) => a.seq - b.seq);
    const titles = { summary: L.repSumT, requests: L.repReqT, invoices: L.repInvT, units: L.repUnitT };
    const paper = reportPaper(titles[kind], from, to);
    const reqCode = id => { const r = rows.find(x => x.id === id); return r ? shortCode(r) : ''; };

    if (kind === 'summary') {
      const conf = reqs.filter(r => ['confirmed', 'assigned', 'done'].includes(r.status)).length;
      paper.append(el2('h3', 'rs', esc(L.secReq)));
      paper.append(kpis([[reqs.length, L.kReq], [conf, L.kConf], [reqs.filter(r => r.status === 'done').length, L.kDone], [pct(conf, reqs.length), L.kRate]]));
      const mk = (title, data) => { const d = el2('div'); d.append(el2('h3', 'rs', esc(title)), table([L.cItem, L.cCount, L.cShare], data.map(([k, n]) => [k, n, pct(n, reqs.length)]), [L.repTotal, reqs.length, reqs.length ? '100%' : '—'], [1, 2])); return d; };
      const g1 = el2('div', 'two-t'); g1.append(mk(L.byStatus, countBy(reqs, 'status', L.st)), mk(L.byService, countBy(reqs.map(r => ({ sz: reqSize(r) || '' })), 'sz', L.reqSizes)));
      const g2 = el2('div', 'two-t'); g2.append(mk(L.byWil, countBy(reqs, 'wilayat', L.wil)), mk(L.bySource, countBy(reqs.map(r => ({ source: r.source || 'website' })), 'source', L.src)));
      paper.append(g1, g2);
      if (unitOk && units.length) { paper.append(el2('h3', 'rs', esc(L.secUnits))); paper.append(kpis(unitKpis())); }

      paper.append(el2('h3', 'rs', esc(L.secFin)));
      if (!invOk) paper.append(el2('p', 'small', esc(L.invNA)));
      else {
        const live = invs.filter(v => v.status === 'issued'), voided = invs.filter(v => v.status === 'void');
        const sum = (list, f) => list.reduce((s, v) => s + Number(f(v) || 0), 0);
        const tot = sum(live, v => v.total), paid = sum(live, v => v.amount_paid);
        paper.append(kpis([[live.length, L.kInv], [money(tot), L.kTotal], [money(paid), L.kPaid], [money(tot - paid), L.kDue]]));
        const pmRows = Object.keys(L.pm).filter(k => k).concat(['']).map(k => {
          const l = live.filter(v => (v.payment_method || '') === k);
          return l.length ? [k ? L.pm[k] : L.pm[''], l.length, money(sum(l, v => v.total)), money(sum(l, v => v.amount_paid))] : null;
        }).filter(Boolean);
        paper.append(el2('h3', 'rs', esc(L.byPm)), table([L.hPm, L.cCount, L.hTotal, L.hPaid], pmRows, [L.repTotal, live.length, money(tot), money(paid)], [1, 2, 3]));
        if (voided.length) paper.append(el2('p', 'small', esc(`${L.kVoid}: ${voided.length} · ${money(sum(voided, v => v.total))} ${L.omr}`)));
        paper.append(el2('p', 'small', esc(L.nonVat)));
      }
    } else if (kind === 'requests') {
      if (!reqs.length) paper.append(el2('p', null, esc(L.repEmpty)));
      else {
        const data = reqs.map((r, i) => [i + 1, { html: `<span dir="ltr">${esc(shortCode(r))}</span>` }, muscatDay(r.created_at), r.name, { html: `<span dir="ltr">${esc(r.phone)}</span>` }, L.wil[r.wilayat] || r.wilayat, reqSizeLabel(r), L.src[r.source || 'website'] || r.source, L.st[r.status] || r.status, { html: `<span dir="ltr">${esc((unitOf(r) || {}).code || '')}</span>` }]);
        paper.append(table([L.hNo, L.hReq, L.hDate, L.hCust, L.hMobile, L.hWil, L.hReqSize, L.hSrc, L.hStatus, L.hDriver], data, [L.repTotal, reqs.length, '', '', '', '', '', '', '', '']));
      }
    } else if (kind === 'invoices') {
      if (!invOk) paper.append(el2('p', null, esc(L.invNA)));
      else {
        const svcOf = v => { const r = rows.find(x => x.id === v.request_id); return r ? r.service : '—'; };
        const sum = (list, f) => list.filter(v => v.status === 'issued').reduce((s, v) => s + Number(f(v) || 0), 0);
        const groups = invs.length ? [['storage', invs]] : [];
        if (!groups.length) paper.append(el2('p', null, esc(L.repEmpty)));
        groups.forEach(([k, list]) => {
          paper.append(el2('h3', 'rs', esc(`${L.secFin} · ${list.length}`)));
          const data = list.map((v, i) => [i + 1, { html: `<span dir="ltr">${esc(v.number)}</span>` }, muscatDay(v.issued_at), v.customer_name, { html: `<span dir="ltr">${esc(reqCode(v.request_id))}</span>` }, money(v.total), money(v.amount_paid), v.status === 'void' ? '—' : money(dueOf(v)), v.payment_method ? L.pm[v.payment_method] : '—', v.status === 'void' ? L.invVoid : (dueOf(v) > 0 ? L.stDue : L.invPaid)]);
          const live = list.filter(v => v.status === 'issued').length;
          paper.append(table([L.hNo, L.hInv, L.hDate, L.hCust, L.hReq, L.hTotal, L.hPaid, L.hDue, L.hPm, L.hStatus], data, [L.repTotal, live, '', '', '', money(sum(list, v => v.total)), money(sum(list, v => v.amount_paid)), money(sum(list, v => dueOf(v))), '', ''], [5, 6, 7]));
        });
        if (groups.length) {
          const all = invs;
          paper.append(el2('h3', 'rs', esc(L.repGrand)));
          paper.append(kpis([[all.filter(v => v.status === 'issued').length, L.kInv], [money(sum(all, v => v.total)), L.kTotal], [money(sum(all, v => v.amount_paid)), L.kPaid], [money(sum(all, v => dueOf(v))), L.kDue]]));
        }
        paper.append(el2('p', 'small', esc(L.nonVat)));
      }
    } else if (kind === 'units') {
      if (!unitOk) paper.append(el2('p', null, esc(L.noUnitTable)));
      else if (!units.length) paper.append(el2('p', null, esc(L.repEmpty)));
      else {
        paper.append(kpis(unitKpis()));
        const sorted = units.slice().sort((x, y) => x.code.localeCompare(y.code, 'en', { numeric: true }));
        const endCell = u => { if (!u.end_date) return ''; const n = daysTo(u.end_date); return { html: `<span class="${n < 0 ? 'bad' : n <= 14 ? 'soon' : ''}">${esc(fmtDay(u.end_date))}</span>` }; };
        const data = sorted.map((u, i) => [i + 1, { html: `<b dir="ltr">${esc(u.code)}</b>` }, L.size[u.size] || u.size, u.area_m2 != null ? Number(u.area_m2) : '', u.monthly_rent != null ? money(u.monthly_rent) : '', L.ust[u.status] || u.status, u.customer_name || '', { html: `<span dir="ltr">${esc(u.customer_phone || '')}</span>` }, fmtDay(u.start_date), endCell(u), { html: `<span dir="ltr">${esc(reqCode(u.request_id))}</span>` }]);
        const rentSum = sorted.filter(u => u.status === 'rented').reduce((a, u) => a + Number(u.monthly_rent || 0), 0);
        paper.append(el2('h3', 'rs', esc(L.secUnits)), table([L.hNo, L.hCode, L.hSize, L.hArea, L.hRent, L.hStatus, L.hTenant, L.hMobile, L.hStart, L.hEnd, L.hReq], data, [L.repTotal, sorted.length, '', '', money(rentSum), '', '', '', '', '', ''], [3, 4]));
        paper.append(el2('p', 'small', esc(L.nonVat)));
      }
    }
    finishPaper(paper);

    const { top, acts } = sheetTop(titles[kind]);
    const pr = el2('button', 'btn', esc(L.print)); pr.type = 'button';
    pr.onclick = () => {
      if (kind !== 'summary') { const st = document.createElement('style'); st.id = 'pageSize'; st.textContent = '@page{size:A4 landscape;margin:10mm}'; document.head.append(st); }
      document.body.classList.add('printing'); window.print();

  document.querySelectorAll('[data-rep]').forEach(b => b.addEventListener('click', () => openReport(b.dataset.rep)));

  // ===== الوحدات / Storage units =====
  let uFilter = 'all';
  const daysTo = d => Math.round((new Date(d + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 864e5);
  function unitKpis(){
    const L = t(), n = units.filter(u => u.status !== 'maintenance').length;
    const rented = units.filter(u => u.status === 'rented').length, reserved = units.filter(u => u.status === 'reserved').length;
    const rent = units.filter(u => u.status === 'rented').reduce((a, u) => a + Number(u.monthly_rent || 0), 0);
    return [[units.length, L.kUnits], [rented, L.kRented], [reserved, L.kReserved], [units.filter(u => u.status === 'available').length, L.kAvail], [pct(rented + reserved, n), L.kOcc], [money(rent), L.kRent]];
  }
  function renderUnits(){
    const L = t();
    if (!unitOk) { $('uCounters').replaceChildren(); $('occText').textContent = ''; $('unitList').replaceChildren(el('div', 'empty', L.noUnitTable)); return; }
    // العدّادات
    const items = [['all', L.all, units.length, 'var(--muted)']].concat(Object.keys(USTATUS_COLOR).map(k => [k, L.ust[k], units.filter(u => u.status === k).length, USTATUS_COLOR[k]]));
    $('uCounters').replaceChildren(...items.map(([k, label, n, color]) => {
      const b = el('button', 'chip'); b.type = 'button'; b.setAttribute('aria-pressed', String(uFilter === k));
      const dot = el('span', 'dot'); dot.style.background = color;
      b.append(dot, document.createTextNode(label), el('span', 'n', String(n)));
      b.onclick = () => { uFilter = k; renderUnits(); };
      return b;
    }));
    const usable = units.filter(u => u.status !== 'maintenance').length, used = units.filter(u => ['rented', 'reserved'].includes(u.status)).length;
    $('occText').textContent = units.length ? L.occ(used, usable, pct(used, usable)) : '';
    $('occBar').style.width = usable ? Math.round(used * 100 / usable) + '%' : '0';
    // القائمة
    const q = $('unitSearch').value.trim().toLowerCase();
    const shown = units.filter(u => (uFilter === 'all' || u.status === uFilter) && (!q || [u.code, u.customer_name, u.customer_phone].some(v => (v || '').toLowerCase().includes(q))))
      .sort((x, y) => x.code.localeCompare(y.code, 'en', { numeric: true }));
    if (!shown.length) { $('unitList').replaceChildren(el('div', 'empty', units.length ? L.emptyFilter : L.noUnitsList)); return; }
    $('unitList').replaceChildren(...shown.map(u => {
      const color = USTATUS_COLOR[u.status];
      const c = el('article', 'unit'); c.style.borderTopColor = color;
      const head = el('div', 'unit-head');
      const badge = el('span', 'badge', L.ust[u.status]); badge.style.background = color;
      head.append(el('b', null, u.code), badge);
      c.append(head);
      const meta = el('dl', 'meta');
      addMeta(meta, L.uSize, `${L.size[u.size]}${u.area_m2 ? ' · ' + Number(u.area_m2) + (lang === 'en' ? ' m²' : ' م²') : ''}`);
      addMeta(meta, L.uRent, u.monthly_rent != null ? `${money(u.monthly_rent)} ${L.omr}` : '');
      addMeta(meta, L.uCust, u.customer_name);
      addMeta(meta, L.mobile, u.customer_phone, true);
      addMeta(meta, L.uStart, fmtDay(u.start_date));
      addMeta(meta, L.uEnd, fmtDay(u.end_date));
      const r = u.request_id ? rows.find(x => x.id === u.request_id) : null;
      if (r) addMeta(meta, L.hReq, shortCode(r), true);
      addMeta(meta, L.dNotes, u.notes);
      c.append(meta);
      if (u.end_date && ['rented', 'reserved'].includes(u.status)) {
        const n = daysTo(u.end_date);
        if (n <= 14) c.append(el('span', n < 0 ? 'flag bad' : 'flag soon', L.endsIn(n)));
      }
      const acts = el('div', 'links');
      if (u.customer_phone) {
        const a1 = el('a', null, L.call); a1.href = 'tel:' + u.customer_phone;
        const a2 = el('a', null, L.whatsapp); a2.href = 'https://wa.me/' + u.customer_phone.replace(/[^\d]/g, ''); a2.target = '_blank'; a2.rel = 'noopener';
        acts.append(a1, a2);
      }
      if (r) { const a3 = el('a', null, L.openReq); a3.href = '#'; a3.onclick = e => { e.preventDefault(); openRequest(r); }; acts.append(a3); }
      const eb = el('button', 'btn btn-ghost', L.edit); eb.type = 'button'; eb.onclick = () => openUnitForm(u);
      c.append(acts, eb);
      return c;
    }));
  }

  function openUnitForm(u){

  $('addUnitBtn').onclick = () => openUnitForm(null);
  $('unitCancel').onclick = () => { $('unitForm').hidden = true; editingUnit = null; };
  $('uPhone').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^\d]/g, '').slice(0, 8); });

  $('unitForm').addEventListener('submit', async e => {
    e.preventDefault();
    const L = t(), msg = $('unitMsg');
    msg.className = 'saved err';
    const code = $('uCode').value.trim().toUpperCase();
    if (!code) { msg.textContent = L.errCode; return; }
    if (units.some(x => x.code.toUpperCase() === code && (!editingUnit || x.id !== editingUnit.id))) { msg.textContent = L.errDupCode; return; }
    if ($('uPhone').value && !/^[79]\d{7}$/.test($('uPhone').value)) { msg.textContent = L.errPhone; return; }
    if ($('uStart').value && $('uEnd').value && $('uEnd').value < $('uStart').value) { msg.textContent = L.errDates; return; }
    const num = v => v === '' ? null : Number(v);
    const rec = {
      code, size: $('uSize').value, area_m2: num($('uArea').value), monthly_rent: num($('uRent').value), status: $('uStatus').value,
      customer_name: $('uCust').value.trim() || null, customer_phone: $('uPhone').value ? '+968' + $('uPhone').value : null,
      start_date: $('uStart').value || null, end_date: $('uEnd').value || null, notes: $('uNotes').value.trim() || null
    };
    msg.className = 'saved'; msg.textContent = L.saving;
    const res = editingUnit ? await db.from('units').update(rec).eq('id', editingUnit.id) : await db.from('units').insert(rec);
    if (res.error) { msg.className = 'saved err'; msg.textContent = L.saveFail + res.error.message; return; }

    $('unitForm').hidden = true; editingUnit = null;

  // إخلاء الوحدة: تصبح متاحة، ويُفك ربطها بالطلب
  $('unitRelease').onclick = async () => {
    const L = t(), u = editingUnit, msg = $('unitMsg');
    if (!u || !confirm(L.uReleaseQ)) return;
    msg.className = 'saved'; msg.textContent = L.saving;
    let { error } = await db.from('units').update({ status: 'available', request_id: null, customer_name: null, customer_phone: null, start_date: null, end_date: null }).eq('id', u.id);
    if (!error) {
      const linked = rows.filter(r => r.unit_id === u.id);
      for (const r of linked) { const x = await db.from('requests').update({ unit_id: null }).eq('id', r.id); if (x.error) { error = x.error; break; } }
    }
    if (error) { msg.className = 'saved err'; msg.textContent = L.saveFail + error.message; return; }
    $('unitForm').hidden = true; editingUnit = null;
    load();

  // إضافة عدة وحدات
  $('bulkUnitBtn').onclick = () => { $('unitForm').hidden = true; $('bulkMsg').textContent = ''; $('bulkForm').hidden = false; $('bulkForm').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  $('bulkCancel').onclick = () => { $('bulkForm').hidden = true; };
  $('bulkForm').addEventListener('submit', async e => {
    e.preventDefault();
    const L = t(), msg = $('bulkMsg');
    const pre = $('bPrefix').value.trim().toUpperCase(), from = Number($('bFrom').value), to = Number($('bTo').value);
    msg.className = 'saved err';
    if (!(from >= 1 && to >= from && to - from < 200)) { msg.textContent = L.bBad; return; }
    const pad = String(to).length < 2 ? 2 : String(to).length;
    const have = new Set(units.map(u => u.code.toUpperCase()));
    const num = v => v === '' ? null : Number(v);
    const list = [];
    for (let i = from; i <= to; i++) {
      const code = (pre ? pre + '-' : '') + String(i).padStart(pad, '0');
      if (!have.has(code)) list.push({ code, size: $('bSize').value, area_m2: num($('bArea').value), monthly_rent: num($('bRent').value), status: 'available' });
    }
    if (!list.length) { msg.textContent = L.bDone(0); return; }
    msg.className = 'saved'; msg.textContent = L.saving;
    const { error } = await db.from('units').insert(list);
    if (error) { msg.className = 'saved err'; msg.textContent = L.saveFail + error.message; return; }
    msg.textContent = L.bDone(list.length);
    setTimeout(() => { $('bulkForm').hidden = true; }, 900);
    load();
  });
</script>
</body>
</html>
