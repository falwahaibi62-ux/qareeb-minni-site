<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة الطلبات | قريب مني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400..700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
  /* Layout: a quiet operations board — tabs for requests and drivers, counters on top, one card per record. */
  :root{
    --ivory:#FAF7F2; --sand:#F1EADF; --card:#FFFDF9;
    --navy:#1F3A4D; --navy-2:#2C4D63; --muted:#5A6A76;
    --brass:#B8915A; --brass-text:#85632F; --border:#E3D9CA;
    --error:#B3261E; --ok:#2F6B4F; --warn:#8A5A00;
    --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
    --body:"IBM Plex Sans Arabic",Tahoma,sans-serif;
    --s-new:#B8915A; --s-contacted:#4F7A96; --s-confirmed:#2F6B4F; --s-assigned:#6B5B95; --s-done:#5A6A76; --s-cancelled:#B3261E;
    --d-available:#2F6B4F; --d-busy:#B8915A; --d-leave:#4F7A96; --d-suspended:#B3261E;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ivory);color:var(--navy);font-family:var(--body);font-size:15px;line-height:1.6}
  .wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1,h2,h3,h4{font-family:var(--display);margin:0;line-height:1.3}
  button,input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:3px solid var(--brass);outline-offset:2px}
  .btn{border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--navy);color:var(--ivory)}
  .btn:hover{background:var(--navy-2)}
  .btn:disabled{opacity:.6;cursor:default}
  .btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--border)}
  .btn-ghost:hover{background:var(--sand)}
  .lang{background:transparent;border:1.5px solid var(--border);color:var(--navy);border-radius:999px;padding:6px 14px;font:600 14px var(--display);cursor:pointer}
  .lang:hover{border-color:var(--navy)}
  input,select,textarea{width:100%;background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:8px 10px;min-width:0}
  input:focus,select:focus,textarea:focus{border-color:var(--navy);outline:none}
  [hidden]{display:none!important}

  /* Login */
  .login{min-height:100vh;display:grid;place-items:center;padding:24px}
  .login-card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;display:grid;gap:14px}
  .login-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .login-card h1{font-size:24px}
  .login-card p{margin:0;color:var(--muted)}
  .login-card label{display:grid;gap:6px;font-weight:600}
  .msg{font-size:14px;color:var(--error);min-height:1em}

  /* Header + tabs */
  header{position:sticky;top:0;z-index:10;background:rgba(250,247,242,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{width:70px;height:auto}
  .brand svg path,.brand svg circle{fill:none;stroke:var(--navy);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .brand svg .house{stroke:var(--brass)}
  .brand b{font-family:var(--display);font-size:18px}
  .brand span{display:block;font-size:12px;color:var(--muted)}
  .who{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
  .pol{font-size:13px;font-weight:600;color:var(--brass-text);text-decoration:none;border-bottom:1px dashed var(--brass)}
  .pol:hover{color:var(--navy);border-bottom-color:var(--navy)}
  .tabs{display:flex;gap:4px}
  .tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;cursor:pointer;color:var(--muted)}
  .tab[aria-selected=true]{color:var(--navy);border-bottom-color:var(--brass)}

  /* Toolbar */
  .counters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 12px}
  .chip{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
  .chip .n{font-variant-numeric:tabular-nums;background:var(--sand);border-radius:999px;padding:0 8px;font-size:13px}
  .chip[aria-pressed=true]{border-color:var(--navy);background:var(--navy);color:var(--ivory)}
  .chip[aria-pressed=true] .n{background:rgba(255,255,255,.18)}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .tools{display:flex;gap:10px;align-items:center;margin:20px 0 16px;flex-wrap:wrap}
  .counters + .tools{margin-top:0}
  .tools input{max-width:320px}
  .stamp{font-size:13px;color:var(--muted)}

  /* Cards */
  .list{display:grid;gap:14px;padding-bottom:48px}
  .req{background:var(--card);border:1px solid var(--border);border-inline-start:4px solid var(--border);border-radius:14px;padding:18px;display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
  .req-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .req-head h3{font-size:18px}
  .badge{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;color:#fff}
  .code{font-family:var(--display);font-size:13px;color:var(--muted);direction:ltr}
  .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:10px;font-size:14px}
  .meta dt{color:var(--muted)}
  .meta dd{margin:0;min-width:0;overflow-wrap:anywhere}
  .meta dd.ltr{direction:ltr;unicode-bidi:isolate}
  html[dir=ltr] .meta dd{text-align:left}
  html[dir=rtl] .meta dd{text-align:right}
  .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .links a{font-size:13px;font-weight:600;text-decoration:none;border:1.5px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--navy);background:#fff}
  .links a:hover{border-color:var(--navy)}
  .edit{display:grid;gap:10px;align-content:start;background:var(--ivory);border-radius:10px;padding:14px}
  .edit label{display:grid;gap:4px;font-size:13px;font-weight:600}
  .edit textarea{min-height:64px;resize:vertical}
  .hint{font-size:12px;font-weight:500;color:var(--muted)}
  .hint.warn{color:var(--warn)}
  .save-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .saved{font-size:13px;color:var(--ok)}
  .saved.err{color:var(--error)}
  .audit{font-size:12px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:48px 16px;background:var(--card);border:1px dashed var(--border);border-radius:14px}
  .flag{font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px}
  .flag.bad{background:#F8E1DF;color:var(--error)}
  .flag.soon{background:#F6E9D2;color:var(--warn)}
  .stars{color:var(--brass);letter-spacing:1px}

  /* Driver form */
  .dform{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .dform h3{grid-column:1/-1;font-size:18px}
  .dform h4{grid-column:1/-1;font-size:14px;color:var(--brass-text);border-bottom:1px solid var(--border);padding-bottom:4px;margin-top:6px}
  .dform label{display:grid;gap:4px;font-size:13px;font-weight:600}
  .dform .wide{grid-column:1/-1}
  .dform .check{display:flex;gap:8px;align-items:flex-start;font-weight:500}
  .dform .check input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--navy)}
  .dform .legal{font-size:12px;color:var(--muted);background:var(--sand);border-radius:8px;padding:8px 10px}
  .rate{display:grid;grid-template-columns:1fr auto;gap:6px}
  .phone{display:flex;direction:ltr}
  .phone span{display:flex;align-items:center;padding:0 10px;background:var(--sand);border:1.5px solid var(--border);border-right:0;border-radius:8px 0 0 8px;font-weight:600;color:var(--muted)}
  .phone input{border-radius:0 8px 8px 0;direction:ltr;text-align:left}

  /* Invoice: modal with an issue form or the printable invoice */
  .inv-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
  .inv-tag{font-weight:700;border-radius:6px;padding:1px 8px;background:var(--sand);color:var(--navy)}
  .inv-tag.paid{background:#DDEEE5;color:var(--ok)}
  .inv-tag.due{background:#F6E9D2;color:var(--warn)}
  .modal{position:fixed;inset:0;z-index:50;background:rgba(31,58,77,.45);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:24px 16px}
  .sheet{background:var(--card);border-radius:16px;width:100%;max-width:820px;padding:20px;display:grid;gap:14px}
  .sheet-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
  .sheet-top h3{font-size:19px}
  .sheet-actions{display:flex;gap:8px;flex-wrap:wrap}
  .items{width:100%;border-collapse:collapse;font-size:14px}
  .items th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:4px}
  .items td{padding:4px;vertical-align:top}
  .items td.num{width:110px}
  .items td.qty{width:80px}
  .items .x{background:none;border:0;color:var(--error);font-size:18px;cursor:pointer;padding:4px 8px}
  .inv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .inv-grid label{display:grid;gap:4px;font-size:13px;font-weight:600}
  .inv-grid .wide{grid-column:1/-1}
  .sum{font-family:var(--display);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}

  /* The invoice paper — bilingual, printed as-is */
  .paper{background:#fff;color:#1F3A4D;border:1px solid var(--border);border-radius:10px;padding:28px;font-size:13.5px}
  .paper .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--brass);padding-bottom:14px}
  .paper .co{display:flex;gap:12px;align-items:center}
  .paper .co svg{width:84px;height:auto}
  .paper .co svg path,.paper .co svg circle{fill:none;stroke:#1F3A4D;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
  .paper .co svg .house{stroke:#B8915A}
  .paper .co b{font-family:var(--display);font-size:20px;display:block}
  .paper .small{font-size:12px;color:#5A6A76}
  .paper .ttl{text-align:end}
  .paper .ttl h2{font-size:22px;color:#85632F}
  .paper .two{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0}
  .paper .box{background:#FAF7F2;border-radius:8px;padding:10px 12px}
  .paper .box dl{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin:6px 0 0}
  .paper .box dt{color:#5A6A76}
  .paper .box dd{margin:0}
  .paper table{width:100%;border-collapse:collapse;margin-top:6px}
  .paper th{background:#1F3A4D;color:#FAF7F2;font-weight:600;font-size:12px;padding:7px 8px;text-align:start}
  .paper td{border-bottom:1px solid #E3D9CA;padding:7px 8px}
  .paper .n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
  .paper .tot{margin-top:12px;margin-inline-start:auto;width:min(320px,100%);display:grid;grid-template-columns:1fr auto;gap:4px 16px}
  .paper .tot .g{font-family:var(--display);font-weight:700;font-size:16px;border-top:2px solid #1F3A4D;padding-top:6px}
  .paper .foot{margin-top:20px;border-top:1px solid #E3D9CA;padding-top:10px;text-align:center}
  .paper .amt{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#1F3A4D;color:#FAF7F2;border-radius:10px;padding:14px 18px;margin:16px 0}
  .paper .amt b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
  .rec-list{width:100%;border-collapse:collapse;font-size:14px}
  .rec-list th{font-size:12px;color:var(--muted);text-align:start;padding:6px;border-bottom:1px solid var(--border)}
  .rec-list td{padding:7px 6px;border-bottom:1px solid var(--border)}
  .rec-list .btn{padding:4px 12px;font-size:13px}
  .sec-h{font-family:var(--display);font-size:16px;margin:4px 0 0}
  .paper .void{color:#B3261E;font-family:var(--display);font-weight:700;font-size:18px;text-align:center;border:2px solid #B3261E;border-radius:8px;padding:4px;margin-bottom:10px}
  .paper .bi{display:block;font-size:11px;color:#5A6A76;font-weight:500}
  .ltrnum{direction:ltr;unicode-bidi:isolate}

  /* Reports */
  .rp-controls{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin:20px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:end}
  .rp-controls label{display:grid;gap:4px;font-size:13px;font-weight:600}
  .rp-controls h3{grid-column:1/-1;font-size:18px}
  .rp-controls .hint{grid-column:1/-1}
  .rp-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-bottom:48px}
  .rp-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;display:grid;gap:8px;align-content:start}
  .rp-card h4{margin:0;font-family:var(--display);font-size:17px}
  .rp-card p{margin:0;font-size:13.5px;color:var(--muted)}
  .rp-card .btn{justify-self:start;margin-top:6px}
  .paper .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 4px}
  .paper .kpi{background:#FAF7F2;border:1px solid #E3D9CA;border-radius:8px;padding:10px 12px}
  .paper .kpi b{display:block;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
  .paper .kpi span{font-size:11.5px;color:#5A6A76}
  .paper h3.rs{font-size:15px;margin:18px 0 6px;color:#85632F;font-family:var(--display);break-after:avoid}
  .paper .kpis,.paper .two-t > div{break-inside:avoid}
  .paper .two-t{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .paper table.rt{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
  .paper table.rt th{background:#1F3A4D;color:#FAF7F2;font-weight:600;padding:6px 7px;text-align:start;white-space:nowrap}
  .paper table.rt td{border-bottom:1px solid #E3D9CA;padding:5px 7px;vertical-align:top}
  .paper table.rt tr:nth-child(even) td{background:#FBF8F3}
  .paper table.rt tfoot td{font-weight:700;border-top:2px solid #1F3A4D;background:#fff}
  .paper .meta-line{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:12px;color:#5A6A76;margin-top:10px}
  .paper .meta-line b{color:#1F3A4D}
  .paper .bad{color:#B3261E;font-weight:600} .paper .soon{color:#8A5A00;font-weight:600}
  .paper .conf{margin-top:18px;border-top:1px solid #E3D9CA;padding-top:8px;font-size:11px;color:#5A6A76;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .rt-wrap{overflow-x:auto}
  @media screen and (max-width:860px){ .rp-controls,.rp-cards{grid-template-columns:1fr 1fr} .paper .kpis{grid-template-columns:1fr 1fr} .paper .two-t{grid-template-columns:1fr} }

  @media print{
    body.printing > *:not(#invModal){display:none!important}
    body.printing{background:#fff}
    body.printing #invModal{position:static;background:none;padding:0;display:block}
    body.printing .sheet{max-width:none;padding:0;background:#fff}
    body.printing .sheet > *:not(.paper){display:none!important}
    body.printing .paper{border:0;padding:0}
    @page{size:A4;margin:12mm}
    body.printing .rt-wrap{overflow:visible}
    body.printing .paper table.rt{font-size:10.5px}
    body.printing .paper tr{break-inside:avoid}
    body.printing .paper thead{display:table-header-group}
  }

  @media (max-width:760px){
    .req{grid-template-columns:1fr}
    .dform{grid-template-columns:1fr}
    .who .email{display:none}
    .inv-grid{grid-template-columns:1fr}
    .paper{padding:16px}
    .paper .two{grid-template-columns:1fr}
    .items td.num{width:80px}
    .items td.qty{width:56px}
  }
</style>
</head>
<body>

<!-- ===== شاشة الدخول / Login ===== -->
<div class="login" id="loginView">
  <form class="login-card" id="loginForm">
    <div class="login-top">
      <h1 data-t="title">لوحة الطلبات</h1>
      <button class="lang" type="button" data-lang-btn>EN</button>
    </div>
    <p data-t="staffOnly">قريب مني · للموظفين فقط</p>
    <label><span data-t="email">البريد الإلكتروني</span><input type="email" id="email" autocomplete="username" required dir="ltr"></label>
    <label><span data-t="password">كلمة المرور</span><input type="password" id="password" autocomplete="current-password" required dir="ltr"></label>
    <button class="btn" type="submit" id="loginBtn" data-t="login">دخول</button>
    <span class="msg" id="loginMsg" role="alert"></span>
  </form>
</div>

<!-- ===== اللوحة / Board ===== -->
<div id="appView" hidden>
  <header>
    <div class="wrap bar">
      <div class="brand">
        <svg viewBox="30 4 262 124" aria-hidden="true">
          <path d="M58 118C53 110 36 98 36 78A22 22 0 1 1 80 78C80 98 63 110 58 118Z"/><circle cx="58" cy="78" r="8"/>
          <path d="M58 118c-4 3-1 7 4 5C100 112 150 128 168 108C182 92 140 86 150 70C160 54 210 70 236 76C248 79 256 80 262 78c4-2 2-6-2-4"/>
          <path d="M262 74C257 66 240 54 240 34A22 22 0 1 1 284 34C284 54 267 66 262 74Z"/><path class="house" d="M253 37L262 29L271 37V45H253Z"/>
        </svg>
        <div><b data-t="title">لوحة الطلبات</b><span data-t="brand">قريب مني</span></div>
      </div>
      <nav class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabReq" aria-selected="true" data-t="tabRequests">الطلبات</button>
        <button class="tab" role="tab" id="tabDrv" aria-selected="false" data-t="tabDrivers">السائقون</button>
        <button class="tab" role="tab" id="tabRep" aria-selected="false" data-t="tabReports">التقارير</button>
      </nav>
      <div class="who">
        <a class="pol" href="policies.html" target="_blank" rel="noopener" data-t="policies">الشروط والسياسات</a>
        <span class="email" id="userEmail" dir="ltr"></span>
        <button class="lang" type="button" data-lang-btn>EN</button>
        <button class="btn btn-ghost" id="logoutBtn" type="button" data-t="logout">خروج</button>
      </div>
    </div>
  </header>

  <!-- الطلبات / Requests -->
  <main class="wrap" id="reqPane">
    <div class="counters" id="counters" role="group"></div>
    <div class="tools">
      <button class="btn" type="button" id="addReqBtn" data-t="addReq">+ طلب جديد</button>
      <input type="search" id="search">
      <button class="btn btn-ghost" id="refreshBtn" type="button" data-t="refresh">تحديث</button>
      <span class="stamp" id="stamp" aria-live="polite"></span>
    </div>
    <form class="dform" id="reqForm" hidden novalidate>
      <h3 data-t="newReq"></h3>
      <p class="legal wide" data-t="reqLegal"></p>
      <label><span data-t="rName"></span><input id="rName" maxlength="80" dir="auto" autocomplete="off"></label>
      <label><span data-t="mobile"></span><span class="phone"><span>+968</span><input id="rPhone" inputmode="numeric" maxlength="8" placeholder="9XXXXXXX" autocomplete="off"></span></label>
      <label><span data-t="rSource"></span><select id="rSource"></select></label>
      <label><span data-t="service"></span><select id="rService"></select></label>
      <label><span data-t="wilayat"></span><select id="rWilayat"></select></label>
      <label><span data-t="prefDate"></span><input id="rDate" type="date"></label>
      <label class="wide"><span data-t="address"></span><input id="rAddress" maxlength="200" dir="auto"></label>
      <label class="wide"><span data-t="custNotes"></span><textarea id="rNotes" maxlength="600" dir="auto"></textarea></label>
      <label><span data-t="status"></span><select id="rStatus"></select></label>
      <label class="wide" style="grid-column:span 2"><span data-t="adminNotes"></span><input id="rAdminNotes" maxlength="600" dir="auto"></label>
      <label class="check wide"><input type="checkbox" id="rConsent"><span data-t="rConsent"></span></label>
      <div class="save-row wide">
        <button class="btn" type="submit" data-t="createReq">إنشاء الطلب</button>
        <button class="btn btn-ghost" type="button" id="reqCancel" data-t="cancel">إلغاء</button>
        <span class="saved" id="reqMsg" aria-live="polite"></span>
      </div>
    </form>
    <div class="list" id="list"></div>
  </main>

  <!-- السائقون / Drivers -->
  <main class="wrap" id="drvPane" hidden>
    <div class="tools">

  };
  const STATUS_COLOR = { new: 'var(--s-new)', contacted: 'var(--s-contacted)', confirmed: 'var(--s-confirmed)', assigned: 'var(--s-assigned)', done: 'var(--s-done)', cancelled: 'var(--s-cancelled)' };
  const DSTATUS_COLOR = { available: 'var(--d-available)', busy: 'var(--d-busy)', leave: 'var(--d-leave)', suspended: 'var(--d-suspended)' };
  const ACTIVE = ['contacted', 'confirmed', 'assigned'];   // طلبات تشغل السائق
  const DOCS = [['voc', 'voc_expiry'], ['license', 'license_expiry'], ['insurance', 'insurance_expiry']];

  const $ = id => document.getElementById(id);
  let db = null, rows = [], drivers = [], invoices = [], invOk = true, receipts = [], recOk = true, filter = 'open', timer = null, lastLoad = null, editingDriver = null;
  let lang = 'ar';
  try { if (localStorage.getItem('qm-admin-lang') === 'en') lang = 'en'; } catch (e) {}
  const t = () => T[lang];
  const today = () => new Date().toISOString().slice(0, 10);

  function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fillSelect(sel, map, current){
    const cur = current == null ? '' : String(current);
    sel.replaceChildren(...Object.entries(map).map(([k, v]) => { const o = el('option', null, v); o.value = k; if (k === cur) o.selected = true; return o; }));
  }

  // ===== اللغة / Language =====
  function applyLang(){
    const L = t();
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
    document.title = L.docTitle;
    document.querySelectorAll('[data-t]').forEach(e => { e.textContent = L[e.dataset.t]; });
    document.querySelectorAll('[data-lang-btn]').forEach(b => { b.textContent = L.langBtn; b.setAttribute('aria-label', L.langAria); b.lang = lang === 'en' ? 'ar' : 'en'; });
    $('search').placeholder = L.search;
    $('drvSearch').placeholder = L.drvSearch;
    $('counters').setAttribute('aria-label', L.filterLabel);
    fillSelect($('dTruck'), L.truck, $('dTruck').value || 'medium');
    fillSelect($('dStatus'), L.dst, $('dStatus').value || 'available');
    fillSelect($('dContract'), L.contract, $('dContract').value || 'independent');
    fillSelect($('dLicType'), L.lic, $('dLicType').value);
    fillSelect($('dRateUnit'), L.unit, $('dRateUnit').value || 'trip');
    fillSelect($('dRating'), L.rating, $('dRating').value);
    $('dDays').placeholder = lang === 'en' ? 'e.g. Saturday to Thursday' : 'مثال: السبت إلى الخميس';
    $('drvFormTitle').textContent = editingDriver ? L.editDriver : L.newDriver;
    fillReqSelects();
    fillSelect($('rpPreset'), L.presets, $('rpPreset').value || 'month');
    $('rpHint').textContent = L.repHint;
    $('loginMsg').textContent = '';
    stampText();
    if (!$('appView').hidden) { render(); renderDrivers(); }
  }
  document.querySelectorAll('[data-lang-btn]').forEach(b => b.addEventListener('click', () => {
    lang = lang === 'ar' ? 'en' : 'ar';
    try { localStorage.setItem('qm-admin-lang', lang); } catch (e) {}
    applyLang();
  }));

  // ===== التبويبات / Tabs =====
  function showTab(name){
    $('tabReq').setAttribute('aria-selected', String(name === 'req'));
    $('tabDrv').setAttribute('aria-selected', String(name === 'drv'));
    $('tabRep').setAttribute('aria-selected', String(name === 'rep'));
    $('reqPane').hidden = name !== 'req';
    $('drvPane').hidden = name !== 'drv';
    $('repPane').hidden = name !== 'rep';
  }
  $('tabReq').onclick = () => showTab('req');
  $('tabDrv').onclick = () => showTab('drv');
  $('tabRep').onclick = () => showTab('rep');

  // ===== الاتصال والدخول / Connection and login =====
  applyLang();
  if (!window.supabase) {
    $('loginMsg').textContent = t().noLib;
  } else {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, storage: window.sessionStorage } });
    db.auth.getSession().then(({ data }) => { if (data.session) showApp(data.session); });
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (!db) return;
    const btn = $('loginBtn'); btn.disabled = true; $('loginMsg').textContent = '';
    const { data, error } = await db.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    btn.disabled = false;
    if (error) { $('loginMsg').textContent = t().badLogin; return; }
    $('password').value = '';
    showApp(data.session);
  });

  $('logoutBtn').addEventListener('click', async () => {
    clearInterval(timer);
    await db.auth.signOut();
    rows = []; drivers = []; $('list').replaceChildren(); $('drvList').replaceChildren();
    $('appView').hidden = true; $('loginView').hidden = false;
  });

  function showApp(session){
    $('userEmail').textContent = session.user.email;
    $('loginView').hidden = true; $('appView').hidden = false;
    load();
    clearInterval(timer);
    timer = setInterval(load, 60000);   // تحديث تلقائي كل دقيقة
  }

  // ===== تحميل البيانات / Load data =====
  async function load(){
    const [r, d, v, rc] = await Promise.all([
      db.from('requests').select('*').order('created_at', { ascending: false }).limit(500),
      db.from('drivers').select('*').order('name'),
      db.from('invoices').select('*').order('seq', { ascending: false }).limit(1000),
      db.from('receipts').select('*').order('seq', { ascending: false }).limit(2000)
    ]);
    if (r.error) { $('stamp').textContent = t().loadFail + r.error.message; return; }
    rows = r.data; drivers = d.error ? [] : d.data; lastLoad = new Date();
    invOk = !v.error; invoices = v.error ? [] : v.data;
    recOk = !rc.error; receipts = rc.error ? [] : rc.data;   // جدول الإيصالات قد لا يكون مُنشأً بعد   // جدول الفواتير قد لا يكون مُنشأً بعد
    stampText();
    if (d.error) $('stamp').textContent += ' · ' + t().loadFail + d.error.message;   // جدول السائقين لم يُنشأ بعد
    render(); renderDrivers();
  }
  function stampText(){
    if (!lastLoad) return;
    $('stamp').textContent = t().updated + ' ' + lastLoad.toLocaleTimeString(t().locale, { hour: '2-digit', minute: '2-digit' });
  }
  $('refreshBtn').addEventListener('click', load);
  $('search').addEventListener('input', render);
  $('drvSearch').addEventListener('input', renderDrivers);

  const shortCode = r => 'QM-' + r.id.slice(0, 6).toUpperCase();
  const fmtDate = d => d ? new Date(d).toLocaleString(t().locale, { dateStyle: 'medium', timeStyle: 'short' }) : '';
  const fmtDay = d => d ? new Date(d + 'T00:00:00').toLocaleDateString(t().locale, { dateStyle: 'medium' }) : '';

  // فحص الوثائق: لكل وثيقة 'ok' | 'soon' | 'expired' | 'missing'
  function docStates(d, onDate){
    const ref = onDate && onDate > today() ? onDate : today();
    const soon = new Date(); soon.setDate(soon.getDate() + 30);
    const soonStr = soon.toISOString().slice(0, 10);
    return DOCS.map(([key, col]) => {
      const v = d[col];
      const state = !v ? 'missing' : v < ref ? 'expired' : v <= soonStr ? 'soon' : 'ok';
      return { key, state };
    });
  }
  // يمكن إسناده: غير موقوف وكل وثائقه مسجّلة وسارية في تاريخ الطلب
  function assignable(d, onDate){
    if (d.status === 'suspended') return { ok: false, why: t().dst.suspended };
    const bad = docStates(d, onDate).filter(x => x.state === 'missing' || x.state === 'expired');
    if (bad.length) {
      const L = t();
      return { ok: false, why: bad.map(x => x.state === 'missing' ? L.docMissing(L.docs[x.key]) : L.docExpired(L.docs[x.key])).join('، ') };
    }
    return { ok: true };
  }
  // عدد طلبات السائق في نفس التاريخ (غير هذا الطلب)
  const jobsOn = (driverId, date, exceptId) => date ? rows.filter(x => x.driver_id === driverId && x.preferred_date === date && x.id !== exceptId && ACTIVE.includes(x.status)).length : 0;

  // ===== الطلبات / Requests =====
  function renderCounters(){
    const L = t();
    const open = rows.filter(r => !['done','cancelled'].includes(r.status)).length;
    const items = [['open', L.open, open, 'var(--navy)'], ['all', L.all, rows.length, 'var(--muted)']]
      .concat(Object.keys(STATUS_COLOR).map(k => [k, L.st[k], rows.filter(r => r.status === k).length, STATUS_COLOR[k]]));
    $('counters').replaceChildren(...items.map(([k, label, n, color]) => {
      const b = el('button', 'chip'); b.type = 'button'; b.setAttribute('aria-pressed', String(filter === k));
      const dot = el('span', 'dot'); dot.style.background = color;
      b.append(dot, document.createTextNode(label), el('span', 'n', String(n)));
      b.onclick = () => { filter = k; render(); };
      return b;
    }));
  }

  function render(){
    renderCounters();
    const q = $('search').value.trim().toLowerCase();
    const shown = rows.filter(r => {
      if (filter === 'open' && ['done','cancelled'].includes(r.status)) return false;
      if (!['open','all'].includes(filter) && r.status !== filter) return false;
      if (!q) return true;
      return [r.name, r.phone, shortCode(r)].some(v => (v || '').toLowerCase().includes(q));
    });
    if (!shown.length) { $('list').replaceChildren(el('div', 'empty', rows.length ? t().emptyFilter : t().emptyNone)); return; }
    $('list').replaceChildren(...shown.map(card));
  }

  function addMeta(meta, k, v, ltr){
    if (v == null || v === '') return;
    const dd = el('dd', ltr ? 'ltr' : null, String(v)); if (!ltr) dd.dir = 'auto';
    meta.append(el('dt', null, k), dd);
  }

  function card(r){
    const L = t();
    const color = STATUS_COLOR[r.status] || STATUS_COLOR.new;
    const c = el('article', 'req'); c.style.borderInlineStartColor = color;

    // ----- بيانات العميل -----
    const info = el('div');
    const head = el('div', 'req-head');
    const nm = el('h3', null, r.name); nm.dir = 'auto'; head.append(nm);
    const badge = el('span', 'badge', L.st[r.status] || r.status); badge.style.background = color; head.append(badge);
    head.append(el('span', 'code', shortCode(r)));
    info.append(head);

    const meta = el('dl', 'meta');
    addMeta(meta, L.sent, fmtDate(r.created_at));
    addMeta(meta, L.mobile, r.phone, true);
    addMeta(meta, L.service, L.svc[r.service] || r.service);
    addMeta(meta, L.wilayat, L.wil[r.wilayat] || r.wilayat);
    addMeta(meta, L.address, r.address);
    addMeta(meta, L.prefDate, fmtDay(r.preferred_date));
    addMeta(meta, L.custNotes, r.notes);
    addMeta(meta, L.srcLabel, (L.src[r.source || 'website'] || r.source) + (r.created_by ? ' · ' + r.created_by : ''));
    info.append(meta);

    const links = el('div', 'links');
    const a1 = el('a', null, L.call); a1.href = 'tel:' + r.phone;
    const a2 = el('a', null, L.whatsapp); a2.href = 'https://wa.me/' + (r.phone || '').replace(/[^\d]/g, ''); a2.target = '_blank'; a2.rel = 'noopener';
    links.append(a1, a2);
    if (r.lat && r.lng) { const a3 = el('a', null, L.map); a3.href = `https://www.google.com/maps?q=${r.lat},${r.lng}`; a3.target = '_blank'; a3.rel = 'noopener'; links.append(a3); }
    info.append(links);

    // ----- التحكم -----
    const edit = el('div', 'edit');
    const sLab = el('label', null, L.status); const sel = el('select');
    fillSelect(sel, L.st, r.status); sLab.append(sel);

    // قائمة السائقين: القابلون للإسناد والمتاحون في التاريخ أولاً، وغير القابلين يظهرون معطّلين مع السبب
    const dLab = el('label', null, L.driver); const drvSel = el('select');
    const scored = drivers.map(d => ({ d, n: jobsOn(d.id, r.preferred_date, r.id), a: assignable(d, r.preferred_date) }))
      .sort((x, y) => (x.a.ok ? 0 : 1) - (y.a.ok ? 0 : 1) || (x.d.status === 'available' ? 0 : 1) - (y.d.status === 'available' ? 0 : 1) || x.n - y.n || x.d.name.localeCompare(y.d.name));
    const none = el('option', null, L.noDriver); none.value = ''; drvSel.append(none);
    scored.forEach(({ d, n, a }) => {
      const avail = !a.ok ? `${L.notAssignable}: ${a.why}` : r.preferred_date ? (n ? L.busyOn(n) : L.freeOn) : L.noDate;
      const o = el('option', null, `${d.name} · ${L.truck[d.truck_size]} · ${L.dst[d.status]} · ${avail}`);
      o.value = d.id;
      if (!a.ok && d.id !== r.driver_id) o.disabled = true;
      if (d.id === r.driver_id) o.selected = true;
      drvSel.append(o);
    });
    const dHint = el('span', 'hint');
    const updHint = () => {
      const d = drivers.find(x => x.id === drvSel.value);
      if (!d) { dHint.className = 'hint'; dHint.textContent = drivers.length ? '' : L.noDrivers; return; }
      const msgs = [];
      if (!assignable(d, r.preferred_date).ok) msgs.push(L.driverWarnDocs);
      if (jobsOn(d.id, r.preferred_date, r.id)) msgs.push(L.driverWarnBusy);
      if (d.status !== 'available') msgs.push(L.driverWarnStatus);
      dHint.className = msgs.length ? 'hint warn' : 'hint';
      dHint.textContent = msgs.join(' ') || [d.phone, d.plate_number].filter(Boolean).join(' · ');
    };
    drvSel.onchange = updHint; updHint();
    dLab.append(drvSel, dHint);

    const nLab = el('label', null, L.adminNotes); const nts = el('textarea'); nts.dir = 'auto'; nts.value = r.admin_notes || ''; nts.placeholder = L.adminNotesPh; nLab.append(nts);

    const row = el('div', 'save-row');
    const btn = el('button', 'btn', L.save); btn.type = 'button';
    const note = el('span', 'saved'); note.setAttribute('aria-live', 'polite');

  // نموذج إصدار فاتورة جديدة
  function openInvoiceForm(r){
    const L = t();
    const { top } = sheetTop(`${L.invNew} ${shortCode(r)} · ${r.name}`);
    const tbl = el('table', 'items');
    const hr = el('tr'); [L.itemDesc, L.itemQty, L.itemPrice, ''].forEach(h => hr.append(el('th', null, h)));
    const tb = el('tbody'); tbl.append(el('thead'), tb); tbl.tHead.append(hr);
    const sumEl = el('div', 'sum');
    const addLine = (desc = '', qty = 1, price = '') => {
      const tr = el('tr');
      const d = el('input'); d.maxLength = 120; d.dir = 'auto'; d.value = desc; d.setAttribute('aria-label', L.itemDesc);
      const q = el('input'); q.type = 'number'; q.min = '0'; q.step = 'any'; q.value = qty; q.inputMode = 'decimal'; q.setAttribute('aria-label', L.itemQty);
      const p = el('input'); p.type = 'number'; p.min = '0'; p.step = '0.001'; p.value = price; p.inputMode = 'decimal'; p.setAttribute('aria-label', L.itemPrice);
      const x = el('button', 'x', '×'); x.type = 'button'; x.setAttribute('aria-label', L.removeItem); x.onclick = () => { tr.remove(); calc(); };
      const td1 = el('td'), td2 = el('td', 'qty'), td3 = el('td', 'num'), td4 = el('td');
      td1.append(d); td2.append(q); td3.append(p); td4.append(x); tr.append(td1, td2, td3, td4); tb.append(tr);
      [d, q, p].forEach(i => i.addEventListener('input', calc));
    };
    const lines = r.service === 'both' ? [SVC_LINE.move, SVC_LINE.storage] : [SVC_LINE[r.service] || ''];
    lines.forEach(x => addLine(x));
    const add = el('button', 'btn btn-ghost', L.addItem); add.type = 'button'; add.onclick = () => { addLine(); calc(); };

    const grid = el('div', 'inv-grid');
    const mk = (label, input) => { const l = el('label', null, label); l.append(input); grid.append(l); return l; };
    const disc = el('input'); disc.type = 'number'; disc.min = '0'; disc.step = '0.001'; disc.value = '0'; disc.inputMode = 'decimal';
    const paid = el('input'); paid.type = 'number'; paid.min = '0'; paid.step = '0.001'; paid.value = '0'; paid.inputMode = 'decimal';
    const pm = el('select'); fillSelect(pm, L.pm, '');
    mk(L.discount, disc); mk(recOk ? L.paidNow : L.amountPaid, paid); mk(L.payMethod, pm);
    const nt = el('textarea'); nt.maxLength = 400; nt.dir = 'auto'; mk(L.invNotes, nt).classList.add('wide');
    [disc, paid].forEach(i => i.addEventListener('input', calc));

    const readItems = () => [...tb.rows].map(tr => { const [d, q, p] = tr.querySelectorAll('input'); return { desc: d.value.trim(), qty: Number(q.value), price: Number(p.value) }; });
    function calc(){
      const sub = readItems().reduce((s, i) => s + (i.qty > 0 && i.price >= 0 ? Math.round(i.qty * i.price * 1000) / 1000 : 0), 0);
      const tot = sub - Number(disc.value || 0);
      sumEl.textContent = `${L.subtotal}: ${money(sub)} · ${L.grand}: ${money(tot)} ${L.omr} · ${L.due}: ${money(Math.max(0, tot - Number(paid.value || 0)))} ${L.omr}`;
      return { sub, tot };
    }
    calc();

    const row = el('div', 'save-row');
    const go = el('button', 'btn', L.issueBtn); go.type = 'button';
    const msg = el('span', 'saved'); msg.setAttribute('aria-live', 'polite');
    row.append(go, msg);
    let armed = false;
    go.onclick = async () => {
      const items = readItems();
      const { sub, tot } = calc();
      msg.className = 'saved err';
      if (!items.length || items.some(i => !i.desc || !(i.qty > 0) || !(i.price >= 0) || Number.isNaN(i.price))) { msg.textContent = L.errItems; return; }
      if (Number(disc.value || 0) > sub) { msg.textContent = L.errDiscount; return; }
      const paidNow = Number(paid.value || 0);
      if (paidNow > tot + 0.0005) { msg.textContent = L.errPaid; return; }
      if (paidNow > 0 && recOk && !pm.value) { msg.textContent = L.errMethod; return; }
      if (!armed) { armed = true; msg.className = 'saved'; msg.textContent = L.issueAgain; return; }   // تأكيد بضغطة ثانية
      go.disabled = true; msg.className = 'saved'; msg.textContent = L.saving;
      const rec = { request_id: r.id, items, discount: Number(disc.value || 0), payment_method: pm.value || null, notes: nt.value.trim() || null };
      if (!recOk) rec.amount_paid = paidNow;   // قبل تفعيل الإيصالات
      const { data, error } = await db.from('invoices').insert(rec).select().single();
      if (error) { go.disabled = false; armed = false; msg.className = 'saved err'; msg.textContent = L.saveFail + error.message; return; }
      invoices.unshift(data);
      let inv = data, newRec = null;
      if (recOk && paidNow > 0) {
        const rr = await db.from('receipts').insert({ invoice_id: data.id, amount: paidNow, method: pm.value }).select().single();
        if (!rr.error) { newRec = rr.data; receipts.unshift(rr.data); inv = await refreshInvoice(data.id) || data; }
      }
      go.disabled = false; render();
      newRec ? openReceipt(newRec) : openInvoice(inv);
    };

    sheet.replaceChildren(top, tbl, add, grid, sumEl, row);
    modal.hidden = false;
    tb.querySelector('input').focus();
  }

  async function refreshInvoice(id){

  const ymd = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
  const muscatDay = iso => iso ? new Date(iso).toLocaleDateString('en-CA', { timeZone: 'Asia/Muscat' }) : '';
  function setPreset(p){
    const now = new Date(), y = now.getFullYear(), m = now.getMonth();
    let a, b;
    if (p === 'month') { a = new Date(y, m, 1); b = now; }
    else if (p === 'last') { a = new Date(y, m - 1, 1); b = new Date(y, m, 0); }
    else if (p === 'quarter') { a = new Date(y, m - 2, 1); b = now; }
    else if (p === 'year') { a = new Date(y, 0, 1); b = now; }
    else return;
    $('rpFrom').value = ymd(a); $('rpTo').value = ymd(b);
  }
  $('rpPreset').addEventListener('change', e => setPreset(e.target.value));

  function el2(tag, cls, html){ const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const pct = (a, b) => b ? Math.round(a * 1000 / b) / 10 + '%' : '—';
  function countBy(list, key, labels){
    const m = {}; list.forEach(x => { const k = x[key] || '—'; m[k] = (m[k] || 0) + 1; });
    return Object.entries(m).sort((a, b) => b[1] - a[1]).map(([k, n]) => [labels ? (labels[k] || k) : k, n]);
  }
  function table(head, rows, foot, numCols = []){

    const tr = rows.map(r => '<tr>' + r.map((c, i) => `<td${numCols.includes(i) ? ' class="n"' : ''}>${c && c.html ? c.html : esc(c)}</td>`).join('') + '</tr>').join('');
    const tf = foot ? '<tfoot><tr>' + foot.map((c, i) => `<td${numCols.includes(i) ? ' class="n"' : ''}>${esc(c)}</td>`).join('') + '</tr></tfoot>' : '';
    wrap.innerHTML = `<table class="rt"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody>${tf}</table>`;

          paper.append(kpis([[all.filter(v => v.status === 'issued').length, L.kInv], [money(sum(all, v => v.total)), L.kTotal], [money(sum(all, v => v.amount_paid)), L.kPaid], [money(sum(all, v => dueOf(v))), L.kDue]]));

    $('dDays').value = d ? (d.work_days || '') : '';
    $('dRate').value = d && d.agreed_rate != null ? Number(d.agreed_rate) : '';
    fillSelect($('dRateUnit'), L.unit, d ? (d.rate_unit || 'trip') : 'trip');
    fillSelect($('dRating'), L.rating, d && d.rating ? d.rating : '');
    $('dNotes').value = d ? (d.notes || '') : '';
    $('dConsent').checked = d ? d.consent : false;
    $('drvMsg').textContent = '';
    $('drvForm').hidden = false;
    $('drvForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('dName').focus({ preventScroll: true });
  }
  $('addDrvBtn').onclick = () => openDriverForm(null);
  $('drvCancel').onclick = () => { $('drvForm').hidden = true; editingDriver = null; };
  $('dPhone').addEventListener('input', e => { e.target.value = e.target.value.replace(/[^\d]/g, '').slice(0, 8); });

  $('drvForm').addEventListener('submit', async e => {
    e.preventDefault();
    const L = t(), msg = $('drvMsg');
    msg.className = 'saved err';
    if ($('dName').value.trim().length < 2) { msg.textContent = L.errName; return; }
    if (!/^[79]\d{7}$/.test($('dPhone').value)) { msg.textContent = L.errPhone; return; }
    if ($('dContract').value === 'company' && !$('dCompany').value.trim()) { msg.textContent = L.errCompany; return; }
    if (!$('dConsent').checked) { msg.textContent = L.errConsent; return; }
    const num = v => v === '' ? null : Number(v);
    const rec = {
      name: $('dName').value.trim(), phone: '+968' + $('dPhone').value,
      contract_type: $('dContract').value, company_name: $('dCompany').value.trim() || null, cr_number: $('dCr').value.trim() || null,
      status: $('dStatus').value, truck_size: $('dTruck').value, plate_number: $('dPlate').value.trim() || null,
      voc_number: $('dVoc').value.trim() || null, voc_expiry: $('dVocExp').value || null,
      license_type: $('dLicType').value || null, license_expiry: $('dLicExp').value || null, insurance_expiry: $('dInsExp').value || null,
      areas: $('dAreas').value.trim() || null, helpers_count: num($('dHelpers').value), work_days: $('dDays').value.trim() || null,
      agreed_rate: num($('dRate').value), rate_unit: $('dRate').value === '' ? null : $('dRateUnit').value,
      rating: num($('dRating').value), notes: $('dNotes').value.trim() || null, consent: true
    };
    msg.className = 'saved'; msg.textContent = L.saving;
    const res = editingDriver ? await db.from('drivers').update(rec).eq('id', editingDriver.id) : await db.from('drivers').insert(rec);
    if (res.error) { msg.className = 'saved err'; msg.textContent = L.saveFail + res.error.message; return; }
    msg.textContent = L.savedOk;
    $('drvForm').hidden = true; editingDriver = null;
    load();
  });
</script>
</body>
</html>
